        const status = PCL.$('#msStatus', wrap);
        const tick = async () => {
          if (stopped || !document.body.contains(wrap)) return;
          try {
            const r = await API.accounts.msaPoll(flow.device_code);
            if (r && r.pending) {
              if (status) status.textContent = '等待浏览器完成验证…';
              timer = setTimeout(tick, (r.slow ? 10 : flow.interval || 5) * 1000);
              return;
            }
            stopped = true;
            PCL.state.accounts = await API.accounts.list();
            PCL.state.settings.account = r.id;
            PCL.toast(`已登录微软账号 ${r.name}`, 'success', 3000);
            close();
            PCL.render();
          } catch (e) {
            stopped = true;
            if (status) status.style.color = 'var(--danger)';
            if (status) status.textContent = '登录失败：' + String(e.message || e).replace(/^Error invoking remote method .*?: /, '');
            PCL.toast(String(e.message || e).replace(/^Error invoking remote method .*?: /, ''), 'error', 6000);
          }
        };
        timer = setTimeout(tick, (flow.interval || 5) * 1000);
        // 弹窗关闭后停止轮询
        const watcher = setInterval(() => {
          if (!document.body.contains(wrap)) {
            stopped = true;
            clearTimeout(timer);
            clearInterval(watcher);
          }
        }, 1000);
      },
    });
  }

  /* ---------------------- 添加账号弹窗 ---------------------- */
  function addAccountModal() {
    let tab = 'offline';
    const m = PCL.modal({
      title: '添加账号',
      width: 460,
      body: `<div id="accBody"></div>`,
      footer: `<button class="btn" data-close>取消</button><button class="btn primary" id="accOk">添加</button>`,
      onMount: (wrap, close) => {
        const body = wrap.querySelector('#accBody');
        const draw = () => {
          body.innerHTML =
            tab === 'offline'
              ? `<div class="field"><label>用户名</label><div class="control"><input class="input" id="accName" placeholder="3-16 位字母、数字或下划线" maxlength="16" /></div></div>
                 <div class="tiny muted" style="margin-top:8px;line-height:1.7">离线登录仅用于单机与局域网联机，UUID 由用户名按官方算法生成，不需要联网验证。</div>`
              : `<div class="field"><label>认证服务器</label><div class="control"><input class="input" id="accServer" placeholder="https://example.com/api/yggdrasil" /></div></div>
                 <div class="field"><label>邮箱 / 用户名</label><div class="control"><input class="input" id="accName" /></div></div>
                 <div class="field"><label>密码</label><div class="control"><input class="input" id="accPass" type="password" /></div></div>
                 <div class="tiny muted" style="margin-top:8px;line-height:1.7">适用于支持 authlib-injector 的外置登录服务器（如各类皮肤站）。</div>`;
          PCL.$$('[data-tab]', wrap).forEach((b) => b.classList.toggle('primary', b.dataset.tab === tab));
          setTimeout(() => {
            const first = body.querySelector('.input');
            if (first) first.focus();
          }, 20);
        };
        wrap.querySelector('.modal-head span').innerHTML =
          `添加账号 <span class="flex gap-8" style="display:inline-flex;margin-left:12px;vertical-align:middle">
            <button class="btn small outline" data-tab="offline">离线登录</button>
            <button class="btn small outline" data-tab="authlib">外置登录</button>
          </span>`;
        PCL.$$('[data-tab]', wrap).forEach((b) =>
          b.addEventListener('click', () => {
            tab = b.dataset.tab;
            draw();
          })
        );
        draw();

        wrap.querySelector('#accOk').addEventListener('click', async () => {
          try {
            if (tab === 'offline') {
              const name = wrap.querySelector('#accName').value.trim();
              const acc = await API.accounts.addOffline(name);
              PCL.state.accounts = await API.accounts.list();
              PCL.state.settings.account = acc.id;
              PCL.toast(`已添加离线账号 ${acc.name}`, 'success');
            } else {
              const server = wrap.querySelector('#accServer').value.trim();
              const username = wrap.querySelector('#accName').value.trim();
              const password = wrap.querySelector('#accPass').value;
              if (!server || !username || !password) throw new Error('请完整填写认证信息');
              const acc = await API.accounts.authlib({ server, username, password });
              PCL.state.accounts = await API.accounts.list();
              PCL.state.settings.account = acc.id;
              PCL.toast(`已登录 ${acc.name}`, 'success');
            }
            close();
            PCL.render();
          } catch (e) {
            PCL.toast(String(e.message || e).replace('Error invoking remote method \'accounts:authlib\': Error: ', ''), 'error', 4500);
          }
        });
      },
    });
    return m;
  }

  PCL.addAccountModal = addAccountModal;
})();

/* ============================ 版本选择（PCL2 移植） ============================
 * 页面结构、文件夹列表、版本分组与右键菜单按 PCL2 2.13.1.1 的
 * PageSelectLeft / PageSelectRight / ModMinecraft 逻辑移植。
 * PCL2 版权归龙腾猫跃所有，以《PCL 分发有限许可》发布；本项目为 Electron/JS
 * 独立实现，不直接运行其 VB.NET/WPF 源码。许可与署名见 THIRD_PARTY_NOTICES.md。
 * ============================================================================ */
(function () {
  const P = (window.PCLPages = window.PCLPages || {});
  const API = window.API;

  const FOOL_IDS = new Set([
    '15w14a', '3D Shareware v1.34', '20w14infinite', '20w14∞', '22w13oneBlockAt',
    '23w13a_or_b', '24w14potato', '25w14craftmine', '1.RV-Pre1', '23w13a_or_b_2',
  ]);

  const isFool = (id) => FOOL_IDS.has(id) || /craftmine|potato|oneblock|shareware|infinite|∞/i.test(String(id || ''));

  /** 1.0 ~ 1.5.2 归入远古版，和 PCL2 的“不常用版本”观感一致 */
  function isOldRelease(id) {
    const m = /^1\.(\d+)(?:\.|$)/.exec(String(id || ''));
    return !!m && Number(m[1]) <= 5;
  }

  function sortByRelease(items) {
    return items.slice().sort((a, b) => {
      const ta = Date.parse(a.releaseTime) || 0;
      const tb = Date.parse(b.releaseTime) || 0;
      if (tb !== ta) return tb - ta;
      return String(b.id).localeCompare(String(a.id), 'zh-CN', { numeric: true });
    });
  }

  /** 1.21.10 / 1.21.1 归为同一 drop，只把最新的放进“常规版本” */
  function dropOf(v) {
    const gv = String(v.gameVersion || v.inheritsFrom || v.id || '');
    const m1 = /^1\.(\d+)/.exec(gv);
    if (m1) return `1.${m1[1]}`;
    const m2 = /^(\d+\.\d+)/.exec(gv);
    return m2 ? m2[1] : gv;
  }

  function moddedLabel(items) {
    const loaders = [...new Set(items.map((v) => String(v.loader || '').trim()).filter(Boolean))];
    if (loaders.length > 1) return '可安装 Mod';
    return `${loaders[0] || 'Mod'} 版本`;
  }

  function groupVersions(versions, starredIds) {
    const starred = versions.filter((v) => starredIds.has(v.id));
    const rest = versions.filter((v) => !starredIds.has(v.id));
    const buckets = { modded: [], release: [], snap: [], old: [], fool: [], pack: [], other: [] };

    for (const v of rest) {
      if (isFool(v.id)) buckets.fool.push(v);
      else if (v.type === 'modpack') buckets.pack.push(v);
      else if (v.loader) buckets.modded.push(v);
      else if (v.type === 'old_beta' || v.type === 'old_alpha' || isOldRelease(v.id)) buckets.old.push(v);
      else if (v.type === 'snapshot') buckets.snap.push(v);
      else if (v.type === 'modified') buckets.other.push(v);
      else buckets.release.push(v);
    }

    const releases = sortByRelease(buckets.release);
    const latestByDrop = new Map();
    for (const v of releases) {
      const drop = dropOf(v);
      if (!latestByDrop.has(drop)) latestByDrop.set(drop, v);
    }

    // PCL2 只把“整体最新版本”是快照时的那一个快照放进常规版本；其余快照进不常用
    const latestOverall = sortByRelease([...buckets.release, ...buckets.snap])[0] || null;
    const latestSnap = latestOverall && latestOverall.type === 'snapshot' ? latestOverall : null;
    const useful = sortByRelease([...latestByDrop.values(), latestSnap].filter(Boolean));
    const usefulIds = new Set(useful.map((v) => v.id));
    const rubbish = sortByRelease([
      ...buckets.old,
      ...buckets.snap.filter((v) => v !== latestSnap),
      ...releases.filter((v) => !usefulIds.has(v.id)),
    ]);

    const groups = [];
    if (starred.length) groups.push({ key: 'star', label: '收藏夹', items: sortByRelease(starred), noCount: true });
    const modded = sortByRelease(buckets.modded);
    if (modded.length) groups.push({ key: 'modded', label: moddedLabel(modded), items: modded });
    if (useful.length) groups.push({ key: 'vanilla', label: '常规版本', items: useful });
    if (rubbish.length) groups.push({ key: 'rubbish', label: '不常用版本', items: rubbish });
    if (buckets.fool.length) groups.push({ key: 'fool', label: '愚人节版本', items: sortByRelease(buckets.fool) });
    if (buckets.pack.length) groups.push({ key: 'pack', label: '整合包', items: sortByRelease(buckets.pack) });
    if (buckets.other.length) groups.push({ key: 'other', label: '其他版本', items: sortByRelease(buckets.other) });
    return groups;
  }

  function folderName(dir) {
    const parts = String(dir || '').split(/[\\/]/).filter(Boolean);
    if (!parts.length) return '.minecraft';
    const base = parts[parts.length - 1];
    if (base === '.minecraft') {
      const parent = parts[parts.length - 2] || '';
      const grand = parts[parts.length - 3] || '';
      if (!parent || /roaming/i.test(parent) || /^(home|users)$/i.test(grand)) return '官方启动器文件夹';
      return parent;
    }
    return base;
  }

  /** PCL2 的版本条目只显示“加载器/类型 + 基础版本”，不显示发布时间 */
  function rowInfo(v) {
    const id = String(v.id || '');
    const base = v.gameVersion || v.inheritsFrom || id;
    const tail = id.startsWith(base)
      ? id
          .slice(base.length)
          .replace(/^[\s_-]+/, '')
          .replace(/[-_]/g, ' · ')
          .replace(/\s+/g, ' ')
          .trim()
      : '';

    if (v.type === 'modpack') return base && base !== id ? `整合包 · ${base}` : '整合包';
    if (v.type === 'old_beta') return `远古 Beta · ${base}`;
    if (v.type === 'old_alpha') return `远古 Alpha · ${base}`;
    if (v.type === 'snapshot') return `快照 · ${base}`;
    if (v.loader) return tail ? `${base} · ${tail}` : `${base} · ${v.loader}`;
    if (v.type === 'modified') return base && base !== id ? `自定义 · ${base}` : '自定义';
    return `原版 · ${base}`;
  }

  function rowHtml(v, starred) {
    const id = PCL.esc(v.id);
    return `<div class="vsel-row" data-id="${id}" role="button" tabindex="0" title="选用 ${id}">
      <span class="vsel-icon">${PCL.blockIcon(isOldRelease(v.id) ? 'stone' : PCL.blockKind(v), 'sm')}</span>
      <div class="vsel-row-main">
        <div class="vsel-row-name">${id}</div>
        <div class="vsel-row-sub">${PCL.esc(rowInfo(v))}</div>
      </div>
      <div class="vsel-row-actions">
        <button class="vsel-act star ${starred ? 'starred' : ''}" data-act="star" title="${starred ? '取消收藏' : '收藏'}">${Icons.star}</button>
        <button class="vsel-act danger" data-act="del" title="删除版本">${Icons.trash}</button>
        <button class="vsel-act" data-act="settings" title="版本设置">${Icons.gear}</button>
      </div>
    </div>`;
  }

  P.select = {
    sidebar: true,

    render(state) {
      const pd = state.pageData;
      const versions = state.versions || [];
      const starredIds = new Set(
        Array.isArray(state.settings.starredVersions) ? state.settings.starredVersions.map(String) : []
      );
      const groups = groupVersions(versions, starredIds);
      const gameDir = state.settings.gameDir || '';
      const folders = Array.isArray(state.folders) && state.folders.length
        ? state.folders
        : [{ path: gameDir, name: folderName(gameDir), active: true, exists: true }];
      const activeFolder = folders.find((f) => f.active || f.path === gameDir) || folders[0];
      const open = pd.vselOpen || {};

      const cards = groups.length
        ? groups
            .map((g) => {
              const expanded = open[g.key] !== undefined ? !!open[g.key] : !['rubbish', 'fool', 'other'].includes(g.key);
              const title = g.noCount ? g.label : `${g.label} (${g.items.length})`;
              return `<section class="vsel-card" data-card="${g.key}">
                <button class="vsel-card-head" data-group="${g.key}" aria-expanded="${expanded}">
                  <span class="vsel-card-title">${PCL.esc(title)}</span>
                  <span class="vsel-card-chev ${expanded ? 'open' : ''}">${Icons.chevron}</span>
                </button>
                ${expanded ? `<div class="vsel-rows">${g.items.map((v) => rowHtml(v, starredIds.has(v.id))).join('')}</div>` : ''}
              </section>`;
            })
            .join('')
        : `<div class="vsel-empty">
             <div class="vsel-empty-title">无可用版本</div>
             <div class="vsel-empty-line"></div>
             <div class="vsel-empty-sub">未找到任何版本的游戏，请先下载任意版本的游戏。<br>若有已存在的游戏，请在左侧列表中选择“添加已有文件夹”，选择 .minecraft 文件夹将其导入。</div>
             <button class="btn primary" id="vselEmptyInstall">下载游戏</button>
           </div>`;

      const folderRows = folders
        .map((f) => {
          const active = f === activeFolder || f.path === (activeFolder && activeFolder.path);
          const name = f.name || folderName(f.path);
          return `<div class="vsel-folder ${active ? 'active' : ''}" data-folder="${PCL.esc(f.path)}" role="button" tabindex="0" title="${PCL.esc(f.path)} · 点击切换，双击打开">
            <span class="vsel-folder-main"><b>${PCL.esc(name)}</b><i>${PCL.esc(f.path)}</i></span>
            <button class="vsel-folder-more" data-folder-menu="${PCL.esc(f.path)}" title="文件夹操作">${Icons.gear}</button>
          </div>`;
        })
        .join('');

      return `<aside class="vsel-side">
        <div class="vsel-side-label">文件夹列表</div>
        <div class="vsel-folder-list">${folderRows}</div>

        <div class="vsel-side-label">添加或导入</div>
        <button class="vsel-side-item" data-side="create">${Icons.plus}新建 .minecraft 文件夹</button>
        <button class="vsel-side-item" data-side="add">${Icons.plus}添加已有文件夹</button>
        <button class="vsel-side-item" data-side="pack">${Icons.package}导入整合包</button>
      </aside>

      <div class="grow vsel-grow">
        <div class="vsel-list">${cards}</div>
      </div>`;
    },

    mount(root, state) {
      const pd = state.pageData;
      const refreshData = async () => {
        const [folders, versions, settings] = await Promise.all([
          API.folders.list().catch(() => state.folders || []),
          API.versions.list().catch(() => []),
          API.settings.get().catch(() => state.settings),
        ]);
        state.folders = Array.isArray(folders) && folders.length ? folders : state.folders;
        state.versions = Array.isArray(versions) ? versions : [];
        state.settings = { ...state.settings, ...(settings || {}) };
        const hasCurrent = state.versions.some((v) => v.id === state.settings.version);
        if (state.versions.length && !hasCurrent) {
          state.settings.version = state.versions[0].id;
          await API.settings.set({ version: state.settings.version }).catch(() => {});
        } else if (!state.versions.length && state.settings.version) {
          state.settings.version = '';
          await API.settings.set({ version: '' }).catch(() => {});
        }
        PCL.render();
      };

      const folders = Array.isArray(state.folders) && state.folders.length
        ? state.folders
        : [{ path: state.settings.gameDir || '', name: folderName(state.settings.gameDir), active: true, exists: true }];

      const activateFolder = async (path, open = false) => {
        if (!path) return;
        if (path === state.settings.gameDir) {
          if (open) API.versions.open('');
          return;
        }
        try {
          const r = await API.folders.switch(path);
          if (r && r.ok === false) throw new Error(r.error || '切换失败');
          await refreshData();
          PCL.toast(`已切换到 ${folderName(path)}`, 'success', 1400);
          if (open) API.versions.open('');
        } catch (e) {
          PCL.toast('切换文件夹失败：' + String(e.message || e), 'error');
        }
      };

      // PCL2 的文件夹操作是右键菜单，不是常驻按钮
      let menu = null;
      let menuOutside = null;
      const closeMenu = () => {
        if (menu && menu.parentNode) menu.parentNode.removeChild(menu);
        menu = null;
        if (menuOutside) {
          document.removeEventListener('mousedown', menuOutside, true);
          menuOutside = null;
        }
      };
      const openFolderMenu = (path, x, y) => {
        closeMenu();
        const only = folders.length <= 1;
        menu = document.createElement('div');
        menu.className = 'vsel-menu';
        menu.innerHTML = `
          <button data-menu="open">${Icons.folder}<span>打开文件夹</span></button>
          <button data-menu="refresh">${Icons.refresh}<span>刷新版本列表</span></button>
          <div class="vsel-menu-sep"></div>
          <button data-menu="remove" class="danger" ${only ? 'disabled' : ''}>${Icons.trash}<span>移出列表</span></button>`;
        document.body.appendChild(menu);
        const mw = menu.offsetWidth || 168;
        const mh = menu.offsetHeight || 112;
        menu.style.left = `${Math.max(6, Math.min(x, window.innerWidth - mw - 8))}px`;
        menu.style.top = `${Math.max(6, Math.min(y, window.innerHeight - mh - 8))}px`;

        menu.querySelectorAll('[data-menu]').forEach((btn) =>
          btn.addEventListener('click', async () => {
            const action = btn.dataset.menu;
            closeMenu();
            if (action === 'open') return activateFolder(path, true);
            if (action === 'refresh') return refreshData();
            if (action === 'remove') {
              if (folders.length <= 1) return PCL.toast('至少要保留一个游戏文件夹', 'error');
              PCL.confirm(
                '从列表移除文件夹',
                `只会把「${path}」从启动器列表移除，不会删除磁盘上的任何文件。确定继续吗？`,
                async () => {
                  try {
                    const r = await API.folders.remove(path);
                    if (r && r.ok === false) throw new Error(r.error || '移除失败');
                    await refreshData();
                    PCL.toast('已从列表移除', 'success');
                  } catch (e) {
                    PCL.toast('移除失败：' + String(e.message || e), 'error');
                  }
                },
                '移除'
              );
            }
          })
        );

        setTimeout(() => {
          menuOutside = (e) => {
            if (!menu) return closeMenu();
            if (menu.contains(e.target)) return;
            closeMenu();
          };
          document.addEventListener('mousedown', menuOutside, true);
        }, 0);
      };

      PCL.$('#vselEmptyInstall', root)?.addEventListener('click', () => {
        pd.dlTab = 'auto';
        PCL.go('download');
      });

      PCL.$$('[data-folder]', root).forEach((folder) => {
        const path = folder.dataset.folder;
        folder.addEventListener('click', (e) => {
          if (e.target.closest('[data-folder-menu]')) return;
          activateFolder(path);
        });
        folder.addEventListener('dblclick', (e) => {
          if (e.target.closest('[data-folder-menu]')) return;
          activateFolder(path, true);
        });
        folder.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activateFolder(path);
          }
        });
        folder.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openFolderMenu(path, e.clientX, e.clientY);
        });
      });

      PCL.$$('[data-folder-menu]', root).forEach((btn) =>
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const rect = btn.getBoundingClientRect();
          openFolderMenu(btn.dataset.folderMenu, rect.left, rect.bottom + 4);
        })
      );

      PCL.$$('[data-side]', root).forEach((btn) =>
        btn.addEventListener('click', async () => {
          const side = btn.dataset.side;
          if (side === 'pack') {
            pd.dlTab = 'pack';
            PCL.go('download');
            return;
          }
          if (side === 'add' || side === 'create') {
            try {
              const r = await API.folders[side]();
              if (!r || r.canceled) return;
              if (r.ok === false) throw new Error(r.error || '操作失败');
              await refreshData();
              PCL.toast(side === 'create' ? '已创建并切换文件夹' : '已添加并切换文件夹', 'success', 1600);
            } catch (e) {
              PCL.toast('操作失败：' + String(e.message || e), 'error');
            }
          }
        })
      );

      const choose = async (id) => {
        if (id === state.settings.version) return PCL.go('home');
        await PCL.saveSettings({ version: id });
        PCL.toast(`已选用 ${id}`, 'success', 1600);
        PCL.go('home');
      };

      PCL.$$('.vsel-row', root).forEach((row) => {
        const id = row.dataset.id;
        row.addEventListener('click', async (e) => {
          const act = e.target.closest('[data-act]');
          if (act) {
            e.stopPropagation();
            if (act.dataset.act === 'star') {
              const set = new Set(
                Array.isArray(state.settings.starredVersions) ? state.settings.starredVersions.map(String) : []
              );
              if (set.has(id)) set.delete(id);
              else set.add(id);
              await PCL.saveSettings({ starredVersions: [...set] });
              PCL.render();
            } else if (act.dataset.act === 'settings') {
              pd.vTab = 'launch';
              PCL.go('version', { id });
            } else if (act.dataset.act === 'del') {
              PCL.confirm(
                '删除版本',
                `确定删除「${id}」吗？该版本的 jar、Mod 与存档都会被移除，且不可恢复。`,
                async () => {
                  try {
                    const r = await API.versions.del(id);
                    if (r && r.ok === false) throw new Error(r.error || '版本不存在');
                    state.versions = await API.versions.list();
                    if (state.settings.version === id) {
                      state.settings.version = state.versions[0] ? state.versions[0].id : '';
                      await PCL.saveSettings({ version: state.settings.version });
                    }

    async mount(root, state) {
      const id = state.params.id || state.settings.version;
      PCL.$$('[data-vtab]', root).forEach((el) =>
        el.addEventListener('click', () => {
          state.pageData.vTab = el.dataset.vtab;
          PCL.render();
        })
      );

      PCL.$('#vdBannerX', root)?.addEventListener('click', () => {
        const b = PCL.$('#vdBanner', root);
        if (b) b.remove();
      });
      PCL.$('#vdOpenDir2', root)?.addEventListener('click', () => API.versions.open(id));
      PCL.$('#vdOpenMods', root)?.addEventListener('click', () => API.mods.open(id));

      const refreshMods = async () => {
        state.pageData.versionDetail = null;
        await PCL.render();
      };
      PCL.$$('[data-mod-toggle]', root).forEach((btn) =>
        btn.addEventListener('click', async () => {
          const enabled = btn.dataset.enabled === '1';
          btn.disabled = true;
          try {
            await API.mods.toggle(id, btn.dataset.modToggle, enabled);
            await refreshMods();
          } catch (e) {
            PCL.toast('Mod 状态切换失败：' + String(e.message || e), 'error');
            btn.disabled = false;
          }
        })
      );
      PCL.$$('[data-mod-del]', root).forEach((btn) =>
        btn.addEventListener('click', () =>
          PCL.confirm('删除 Mod', `确定删除「${btn.dataset.modDel}」？此操作不可撤销。`, async () => {
            await API.mods.remove(id, btn.dataset.modDel);
            await refreshMods();
          }, '删除')
        )
      );
      PCL.$('#vdModsEnableAll', root)?.addEventListener('click', async () => {
        await API.mods.toggleAll(id, true);
        await refreshMods();
      });
      PCL.$('#vdModsDisableAll', root)?.addEventListener('click', async () => {
        await API.mods.toggleAll(id, false);
        await refreshMods();
      });

      if (!state.pageData.javaList) {
        API.java.detect()
          .then((list) => {
            state.pageData.javaList = list;
            if (state.page === 'version') PCL.render();
          })
          .catch(() => {});
      }

      const save = async (patch, rerender = false) => {
        const v = await API.versions.setSettings(id, patch);
        state.pageData.vSettings = { id, ...v };
        if (rerender) PCL.render();
        else PCL.toast('已保存', 'success', 1200);
      };

      PCL.$('#vdIso', root)?.addEventListener('change', (e) => save({ isolation: e.target.value }));
      PCL.$('#vdTitleInput', root)?.addEventListener('change', (e) => save({ gameTitle: e.target.value.trim() }));
      PCL.$('#vdCustomInfo', root)?.addEventListener('change', (e) => save({ customInfo: e.target.value.trim() }));
      PCL.$('#vdJava', root)?.addEventListener('change', (e) => save({ javaPath: e.target.value }));
      PCL.$('#vdOptimize', root)?.addEventListener('change', (e) => save({ optimizeMem: e.target.value }));
      PCL.$('#vdLoginMode', root)?.addEventListener('change', (e) => save({ loginMode: e.target.value }));
      PCL.$('#vdServer', root)?.addEventListener('change', (e) => save({ serverAddress: e.target.value.trim() }));

      PCL.$$('[data-memmode]', root).forEach((el) =>
        el.addEventListener('click', () => save({ memoryMode: el.dataset.memmode }, true))
      );
      const range = PCL.$('#vdMemRange', root);
      if (range) {
        const label = PCL.$('#vdMemVal', root);
        const fmt = (mb) => (mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb + ' MB');
        range.addEventListener('input', () => {
          if (label) label.textContent = fmt(Number(range.value));
        });
        range.addEventListener('change', () => save({ memoryMode: 'custom', maxMemory: Number(range.value) }, true));
      }

      PCL.$('#vdExport', root)?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          const r = await API.versions.export(id);
          if (r && r.ok === false) throw new Error(r.error || '导出失败');
          if (r && r.path) PCL.toast('已导出到 ' + r.path, 'success', 4000);
        } catch (err) {
          PCL.toast(String(err.message || err), 'error', 4000);
        }
        btn.disabled = false;
      });

      PCL.$('#vdExportPack', root)?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = '导出中…';
        try {
          const r = await API.versions.exportPack(id, '');
          if (r && r.ok === false) throw new Error(r.error || '导出失败');
          if (r && r.path) PCL.toast('已导出整合包：' + r.path, 'success', 5000);
        } catch (err) {
          PCL.toast('导出整合包失败：' + String(err.message || err).replace(/^Error invoking remote method .*?: /, ''), 'error', 5000);
        } finally {
          btn.disabled = false;
          btn.textContent = '导出整合包 (.mrpack)';
        }
      });
    },
  };

})();

/* ============================ 下载 ============================ */
(function () {
  const P = (window.PCLPages = window.PCLPages || {});
  const API = window.API;

  const SIDE = [
    { id: 'auto', label: '自动安装', icon: 'download', div: 'Minecraft' },
    { id: 'manual', label: '手动安装包', icon: 'wrench' },
    { id: 'mod', label: 'Mod', icon: 'mod', div: '社区资源' },
    { id: 'pack', label: '整合包', icon: 'package' },
    { id: 'datapack', label: '数据包', icon: 'folder' },
    { id: 'resource', label: '资源包', icon: 'image' },
    { id: 'shader', label: '光影包', icon: 'shader' },
  ];

  /** 从版本名反推 Modrinth 加载器过滤器 */
  function loaderOf(versionId) {
    const s = String(versionId || '');
    if (/neoforge/i.test(s)) return 'neoforge';
    if (/forge/i.test(s)) return 'forge';
    if (/fabric/i.test(s)) return 'fabric';
    if (/quilt/i.test(s)) return 'quilt';
    return '';
  }

  /** 优先使用版本扫描得到的真实 loader，整合包名里不一定带 Fabric/Forge */
  function gameVersionOfCurrent(state) {
    const v = PCL.currentVersion();
    return (v && v.gameVersion) || ((v && v.id) || state.settings.version || '').split('-')[0];
  }
  function loaderOfCurrent(state) {
    const v = PCL.currentVersion();
    const loader = (v && v.loader ? v.loader : loaderOf(v ? v.id : state.settings.version)).toLowerCase();
    if (loader.includes('neoforge')) return 'neoforge';
    if (loader.includes('forge')) return 'forge';
    if (loader.includes('quilt')) return 'quilt';
    if (loader.includes('fabric')) return 'fabric';
    return '';
  }

  P.download = {
    sidebar: true,
    render(state) {
      const pd = state.pageData;
      const tab = pd.dlTab || 'auto';
      const side = SIDE.map(
        (s) =>
          `${s.div ? `<div class="divider">${s.div}</div>` : ''}
           <div class="item ${tab === s.id ? 'active' : ''}" data-tab="${s.id}">${Icons[s.icon]}<span>${s.label}</span></div>`
      ).join('');

      return `<div class="sidebar">${side}</div>
        <div class="grow" style="overflow-y:auto;padding-right:2px">
          ${tab === 'auto' ? autoHtml(state) : ''}
          ${tab === 'manual' ? manualHtml(state) : ''}
          ${['mod', 'datapack', 'resource', 'shader'].includes(tab) ? searchHtml(state, tab) : ''}
          ${tab === 'pack' ? packHtml(state) : ''}
        </div>
        <div class="fab-power" id="fabPower" title="启动游戏">${Icons.power}</div>`;
    },

    mount(root, state) {
      const pd = state.pageData;
      PCL.$('#fabPower', root)?.addEventListener('click', () => PCL.go('home'));
      PCL.$$('.sidebar .item', root).forEach((item) =>
        item.addEventListener('click', async () => {
          pd.dlTab = item.dataset.tab;
          if ((pd.dlTab === 'auto' || pd.dlTab === 'mod') && !pd.manifest) await loadManifest(state);
          if (pd.dlTab === 'auto' && !pd.fabricLoaders) await loadFabric(state);
          PCL.render();
        })
      );

      if ((pd.dlTab || 'auto') === 'auto' || !pd.dlTab) {
        if (!pd.manifest && !pd.manifestError && !pd.manifestLoading) {
          // 只在首次进入时自动加载；失败后停在错误卡片，交给用户点“重新获取”
          loadManifest(state).then(() => PCL.render());
        }
        if (pd.manifest || pd.manifestError) mountAuto(root, state);
      } else if (['mod', 'resource', 'datapack', 'shader'].includes(pd.dlTab)) {
        mountSearch(root, state, pd.dlTab);
      } else if (pd.dlTab === 'pack') {
        mountPack(root, state);
      } else if (pd.dlTab === 'manual') {
        mountManual(root, state);
      }
    },
  };

  /* ---------------------- 数据加载 ---------------------- */
  async function loadManifest(state) {
    const pd = state.pageData;
    pd.manifestError = null;
    pd.manifestLoading = true;
    try {
      const m = await API.manifest();
      if (!m || !Array.isArray(m.versions) || !m.versions.length) throw new Error('版本清单为空');
      pd.manifest = m;
      // 保留清单里的全部版本（正式版 / 快照 / 远古版本），选择器里再分类过滤
      pd.gameVersions = m.versions;
      const latest = m.versions.find((v) => v.type === 'release');
      pd.gameVersion = pd.gameVersion || (latest ? latest.id : '');
    } catch (e) {
      const msg = String(e && e.message ? e.message : e).replace(/^获取版本列表失败：/, '');
      pd.manifest = null;
      pd.manifestError = msg;
      pd.gameVersions = [];
      PCL.toast('获取版本列表失败：' + msg, 'error', 4500);
    } finally {
      pd.manifestLoading = false;
    }
  }

  function manifestStateHtml(pd) {
    if (pd.manifestError) {
      return `<div class="card">
        <div class="card-title">版本列表</div>
        <div class="tiny" style="color:var(--danger);line-height:1.8;word-break:break-all">${PCL.esc(pd.manifestError)}</div>
        <div class="tiny muted mt-8">已自动尝试官方源与 BMCLAPI，仍失败请检查网络或代理设置。</div>
        <button class="btn small primary mt-12" id="btnRetryManifest">重新获取</button>
      </div>`;
    }
    return `<div class="card">
      <div class="card-title">版本列表</div>
      <div class="tiny muted">正在获取版本列表…</div>
    </div>`;
  }

  async function loadFabric(state) {
    try {
      const [loaders] = await Promise.all([API.fabric.loaders()]);
      state.pageData.fabricLoaders = loaders;
      state.pageData.fabricLoader = loaders[0] ? loaders[0].version : '';
    } catch (e) {
      state.pageData.fabricLoaders = [{ version: '0.16.10', stable: true }];
      state.pageData.fabricLoader = '0.16.10';
    }
  }

  /* ---------------------- 自动安装 ---------------------- */
  /** 由版本发布日期推断所需 Java（与官方 javaVersion 一致：1.20.5→21，1.17→17） */
  function javaNeeded(pd, gv) {
    const v = (pd.gameVersions || []).find((x) => x.id === gv);
    if (v && v.javaVersion && v.javaVersion.majorVersion) return v.javaVersion.majorVersion;
    const t = v && v.releaseTime ? new Date(v.releaseTime).getTime() : 0;
    if (t >= Date.UTC(2024, 3, 23)) return 21;
    if (t >= Date.UTC(2021, 5, 8)) return 17;
    return 8;
  }

  function autoHtml(state) {
    const pd = state.pageData;
    if (!pd.manifest) return manifestStateHtml(pd);
    const all = pd.gameVersions || [];
    const releases = all.filter((v) => v.type === 'release');
    const snaps = all.filter((v) => v.type === 'snapshot' && !isFool(v.id));
    const old = all.filter((v) => v.type === 'old_beta' || v.type === 'old_alpha');
    const fools = all.filter((v) => v.type === 'snapshot' && isFool(v.id));
    const latestRelease = releases[0];
    const latestSnap = snaps[0];
    const open = pd.dlOpen || {};

    const fmtDate = (t) => {
      if (!t) return '';
      const d = new Date(t);
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    const latestRow = (v, kind) =>
      v
        ? `<div class="latest-row" data-gv="${PCL.esc(v.id)}">
            <span class="latest-block">${PCL.blockIcon(kind === 'release' ? 'grass' : 'command')}</span>
            <div class="latest-main">
              <div class="latest-name">${PCL.esc(v.id)}</div>
              <div class="latest-sub">最新${kind === 'release' ? '正式版' : '预览版'}，发布于 ${fmtDate(v.releaseTime)}</div>
            </div>
          </div>`
        : '<div class="latest-row disabled"><div class="latest-main"><div class="latest-sub">版本清单加载中…</div></div></div>';

    const group = (key, label, list) => {
      const expanded = !!open[key];
      const rows = expanded
        ? list
            .map(
              (v) => `<div class="ver-row" data-gv="${PCL.esc(v.id)}">
                <span class="ver-id">${PCL.esc(v.id)}</span>
                <span class="ver-date">${fmtDate(v.releaseTime)}</span>
              </div>`
            )
            .join('')
        : '';
      return `<div class="ver-group ${expanded ? 'open' : ''}" data-group="${key}">
        <div class="ver-head" data-toggle="${key}">
          <span class="ver-title">${label} <span class="ver-count">(${list.length})</span></span>
          <span class="ver-chev">${Icons.chevron}</span>
        </div>
        <div class="ver-body">${rows}</div>
      </div>`;
    };

    return `
    <div class="card latest-card">
      <div class="card-title">最新版本</div>
      ${latestRow(latestRelease, 'release')}
      ${latestRow(latestSnap, 'snapshot')}
    </div>
    <div class="ver-groups">
      ${group('release', '正式版', releases)}
      ${group('snapshot', '预览版', snaps)}
      ${group('old', '远古版', old)}
      ${group('fool', '愚人节版', fools)}
    </div>`;
  }

  const FOOL_IDS = new Set([
    '15w14a', '3D Shareware v1.34', '20w14∞', '22w13oneBlockAt', '23w13a_or_b',
    '24w14potato', '25w14craftmine', '1.RV-Pre1', '23w13a_or_b_2',
  ]);
  function isFool(id) {
    return FOOL_IDS.has(id) || /craftmine|potato|oneblock|shareware|∞/i.test(id || '');
  }

  function mountAuto(root, state) {
    const pd = state.pageData;
    PCL.$('#btnRetryManifest', root)?.addEventListener('click', async () => {
      pd.manifestError = null;
      pd.manifestLoading = true;
      PCL.render();
      await loadManifest(state);
      PCL.render();
    });
    if (!pd.javaList) {
      API.java
        .detect()
        .then((list) => {
          pd.javaList = list;
        })
        .catch(() => {});
    }

    PCL.$$('[data-gv]', root).forEach((el) =>
      el.addEventListener('click', () => openInstallModal(state, el.dataset.gv))
    );

    PCL.$$('[data-toggle]', root).forEach((el) =>
      el.addEventListener('click', () => {
        pd.dlOpen = pd.dlOpen || {};
        pd.dlOpen[el.dataset.toggle] = !pd.dlOpen[el.dataset.toggle];
        PCL.render();
      })
    );
  }

  async function openInstallModal(state, gv) {
    const pd = state.pageData;
    pd.gameVersion = gv;
    const javas = pd.javaList || [];
    const need = javaNeeded(pd, gv);
    const javaReady = javas.find((j) => j.major === need) || javas.find((j) => j.major > need);

    const body = `
      <div class="set-row"><label>游戏版本</label><input class="input" value="${PCL.esc(gv)}" readonly /></div>
      <div class="set-row"><label>加载器</label>
        <select class="select" id="imLoader">
          <option value="">原版</option>
          <option value="fabric">Fabric</option>
          <option value="quilt">Quilt</option>
          <option value="forge">Forge</option>
          <option value="neo">NeoForge</option>
          <option value="optifine">OptiFine</option>
        </select>
      </div>
      <div id="imLoaderBox"></div>
      <div class="set-row"><label>安装后名称</label><input class="input" id="imName" value="${PCL.esc(gv)}" /></div>
      <div class="tiny muted mt-8">该版本需要 Java ${need} · ${
        javaReady ? `已找到 Java ${javaReady.major}` : '本机未检测到，安装后启动时会自动下载'
      }</div>`;

    PCL.modal({
      title: '安装游戏',
      width: 520,
      body,
      footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="imInstall">开始安装</button>',
      onMount: (wrap, close) => {
        const loaderSel = PCL.$('#imLoader', wrap);
        const box = PCL.$('#imLoaderBox', wrap);
        const nameInput = PCL.$('#imName', wrap);

        const refreshLoaderBox = async (loader) => {
          if (!loader) {
            box.innerHTML = '';
            nameInput.value = gv;
            return;
          }
          if (loader === 'fabric') {
            if (!pd.fabricLoaders) await loadFabric(state);
            const opts = (pd.fabricLoaders || [])
              .map((l) => `<option value="${PCL.esc(l.version)}">${PCL.esc(l.version)}${l.stable ? '（推荐）' : ''}</option>`)
              .join('');
            box.innerHTML = `<div class="set-row"><label>Fabric 版本</label><select class="select" id="imFab">${opts}</select></div>`;
            nameInput.value = `${gv}-Fabric ${pd.fabricLoader || ''}`.trim();
          } else if (loader === 'quilt') {
            box.innerHTML = '<div class="set-row"><label>Quilt 版本</label><select class="select" id="imQuilt"><option>加载中…</option></select></div>';
            const r = await API.quilt.list(gv);
            if (loaderSel.value !== 'quilt') return;
            const opts = (r.versions || [])
              .map((l) => `<option value="${PCL.esc(l.version)}">${PCL.esc(l.version)}${l.stable ? '（推荐）' : ''}</option>`)
              .join('');
            box.innerHTML = `<div class="set-row"><label>Quilt 版本</label><select class="select" id="imQuilt">${opts || '<option value="">暂无可用版本</option>'}</select></div>`;
            nameInput.value = `${gv}-Quilt ${((r.versions || [])[0] || {}).version || ''}`.trim();
          } else if (loader === 'optifine') {
            box.innerHTML = '<div class="set-row"><label>OptiFine 版本</label><select class="select" id="imOF"><option>加载中…</option></select></div>';
            const r = await API.optifine.list(gv);
            if (loaderSel.value !== 'optifine') return;
            const opts = (r.versions || [])
              .map((v) => `<option value="${PCL.esc(v.edition)}">${PCL.esc(v.edition)}</option>`)
              .join('');
            box.innerHTML = `<div class="set-row"><label>OptiFine 版本</label><select class="select" id="imOF">${
              opts || `<option value="">${PCL.esc(r.error || '暂无该版本的 OptiFine')}</option>`
            }</select></div><div class="tiny muted mt-6">从 optifine.net 官方下载并调用官方安装器，需要 Java 8+。</div>`;
            nameInput.value = `${gv}-OptiFine ${((r.versions || [])[0] || {}).edition || ''}`.trim();
          } else if (loader === 'forge') {
            box.innerHTML = '<div class="set-row"><label>Forge 版本</label><select class="select" id="imForge"><option>加载中…</option></select></div>';
            await loadForge(state);
            if (loaderSel.value !== 'forge') return;
            const opts = (pd.forgeVersions || [])
              .map((f) => `<option value="${PCL.esc(f.version)}">${PCL.esc(f.version)}${f.recommended ? '（推荐）' : ''}</option>`)
              .join('');
            box.innerHTML = `<div class="set-row"><label>Forge 版本</label><select class="select" id="imForge">${
              opts || '<option value="">暂无可用版本</option>'
            }</select></div>${
              pd.forgeError
                ? `<div class="tiny" style="color:var(--danger);line-height:1.7;word-break:break-all">${PCL.esc(pd.forgeError)}</div>
                   <button class="btn small mt-8" id="btnRetryForge">重新获取</button>`
                : ''
            }`;
            PCL.$('#btnRetryForge', wrap)?.addEventListener('click', () => refreshLoaderBox('forge'));
            nameInput.value = `${gv}-Forge ${pd.forgeVersion || ''}`.trim();
          } else {
            box.innerHTML = '<div class="set-row"><label>NeoForge 版本</label><select class="select" id="imNeo"><option>加载中…</option></select></div>';
            await loadNeo(state);
            if (loaderSel.value !== 'neo') return;
            const opts = (pd.neoVersions || [])
              .map((n) => `<option value="${PCL.esc(n.version)}">${PCL.esc(n.version)}</option>`)
              .join('');
            box.innerHTML = `<div class="set-row"><label>NeoForge 版本</label><select class="select" id="imNeo">${
              opts || '<option value="">暂无可用版本</option>'
            }</select></div>${
              pd.neoError
                ? `<div class="tiny" style="color:var(--danger);line-height:1.7;word-break:break-all">${PCL.esc(pd.neoError)}</div>
                   <button class="btn small mt-8" id="btnRetryNeo">重新获取</button>`
                : ''
            }`;
            PCL.$('#btnRetryNeo', wrap)?.addEventListener('click', () => refreshLoaderBox('neo'));
            nameInput.value = `${gv}-NeoForge ${pd.neoVersion || ''}`.trim();
          }
        };

        loaderSel.addEventListener('change', () => refreshLoaderBox(loaderSel.value));

        PCL.$('#imInstall', wrap).addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          const loader = loaderSel.value;
          btn.disabled = true;
          btn.textContent = '安装中…';
          try {
            if (loader === 'fabric') {
              const lv = PCL.$('#imFab', wrap).value;
              const r = await API.install.fabric({ gameVersion: gv, loaderVersion: lv, installBase: true, name: nameInput.value.trim() });
              await afterInstall(state, r);
            } else if (loader === 'quilt') {
              const lv = PCL.$('#imQuilt', wrap).value;
              if (!lv) throw new Error('暂无可用 Quilt 版本');
              const r = await API.quilt.install({ gameVersion: gv, loaderVersion: lv, installBase: true, name: nameInput.value.trim() });
              await afterInstall(state, r);
            } else if (loader === 'optifine') {
              const edition = PCL.$('#imOF', wrap).value;
              if (!edition) throw new Error('暂无可用 OptiFine 版本');
              const r = await API.optifine.install({ mcVersion: gv, edition, name: nameInput.value.trim() });
              await afterInstall(state, r);
            } else if (loader === 'forge') {
              const fv = PCL.$('#imForge', wrap).value;
              if (!fv) throw new Error('暂无可用 Forge 版本');
              const r = await API.forge.install({ mcVersion: gv, forgeVersion: fv, kind: 'forge', name: nameInput.value.trim() });
              await afterInstall(state, r);
            } else if (loader === 'neo') {
              const nv = PCL.$('#imNeo', wrap).value;
              if (!nv) throw new Error('暂无可用 NeoForge 版本');
              const r = await API.forge.install({ mcVersion: gv, neoVersion: nv, kind: 'neoforge', name: nameInput.value.trim() });
              await afterInstall(state, r);
            } else {

            }
            close();
          } catch (err) {

            btn.textContent = '开始安装';

  async function afterInstall(state, r) {
    if (!r) return;
    if (r.ok === false) {
      PCL.toast(r.error || '安装失败', 'error', 6000);
      return;
    }
    const id = r.id || (state.pageData.loader === '' ? state.pageData.gameVersion : '');
    if (id) {
      await PCL.saveSettings({ version: id });
      state.versions = await API.versions.list();
      PCL.toast(`已安装 ${id}`, 'success', 3000);
    }
  }

    const pd = state.pageData;
    pd.forgeVersions = [];
    pd.forgeVersion = '';
    pd.forgeError = '';
    try {
      const list = await API.forge.versions(pd.gameVersion || (pd.gameVersions && pd.gameVersions[0].id));

      }
      pd.forgeVersions = Array.isArray(list) ? list : [];
      if (!pd.forgeVersions.length) throw new Error('没有可用的 Forge 版本');
      const rec = pd.forgeVersions.find((f) => f.recommended) || pd.forgeVersions.find((f) => f.latest) || pd.forgeVersions[0];
      pd.forgeVersion = rec ? rec.version : '';
    } catch (e) {
      pd.forgeVersions = [];
      pd.forgeError = String(e && e.message ? e.message : e);
      PCL.toast('Forge 版本列表获取失败：' + pd.forgeError, 'error', 4500);

  }

  /** 进入页面即加载热门，不要求用户先输入关键词 */
  async function loadHotContent(state, tab) {
    const pd = state.pageData;
    const meta = CONTENT_META[tab] || CONTENT_META.mod;
    const key = meta.key;
    if (String(pd[meta.queryKey] || '').trim() || pd[key] || pd[key + 'Loading']) return;
    const source = tab === 'mod' ? (pd.modSource || 'modrinth') : 'modrinth';
    const hasCfKey = !!(state.settings && state.settings.curseForgeApiKey && String(state.settings.curseForgeApiKey).trim());
    if (source === 'curseforge' && !hasCfKey) {
      pd[key] = null;
      pd[key + 'Error'] = 'CurseForge 免 Key 不能浏览热门，只支持精确项目名或链接搜索。';
      PCL.render();
      return;
    }
    const token = (pd[key + 'Token'] || 0) + 1;
    pd[key + 'Token'] = token;
    pd[key + 'Loading'] = true;
    pd[key + 'Error'] = '';
    try {
      if (source === 'curseforge') {
        const r = await API.curseforge.search({ query: '', kind: 'mod', gameVersion: gameVersionOfCurrent(state), loader: loaderOfCurrent(state) });
        if (r && r.ok === false) throw new Error(r.error || 'CurseForge 热门加载失败');
        if (pd[key + 'Token'] !== token) return;
        pd.modSearchKeyless = !!r.keyless;
        pd[key] = { hits: r.hits || [], total: r.total || 0 };
      } else {
        const r = await API.modrinth.search({
          query: '',
          type: meta.type,
          gameVersion: gameVersionOfCurrent(state),
          loader: meta.type === 'mod' ? loaderOfCurrent(state) : '',
          limit: 18,
          sort: 'downloads',
        });
        if (pd[key + 'Token'] !== token) return;
        pd[key] = r;
      }
    } catch (e) {
      if (pd[key + 'Token'] !== token) return;
      pd[key] = { hits: [] };
      pd[key + 'Error'] = String(e.message || e).replace(/^Error invoking remote method .*?: /, '');
    } finally {
      if (pd[key + 'Token'] === token) {
        pd[key + 'Loading'] = false;
        PCL.render();
      }
    }
  }

  function mountSearch(root, state, tab) {
    const pd = state.pageData;
    const meta = CONTENT_META[tab] || CONTENT_META.mod;
    const input = PCL.$('#searchInput', root);
    const source = () => (tab === 'mod' ? (pd.modSource || 'modrinth') : 'modrinth');
    const hasCfKey = () => !!(state.settings && state.settings.curseForgeApiKey && String(state.settings.curseForgeApiKey).trim());

    const doSearch = async () => {
      const q = input.value.trim();
      pd[meta.queryKey] = q;
      const btn = PCL.$('#btnSearch', root);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '搜索中…';
      }
      const token = (pd[meta.key + 'Token'] || 0) + 1;
      pd[meta.key + 'Token'] = token;
      pd[meta.key + 'Loading'] = true;
      pd[meta.key + 'Error'] = '';
      try {
        const gameVersion = gameVersionOfCurrent(state);
        const loader = loaderOfCurrent(state);
        if (source() === 'curseforge') {
          if (!q && !hasCfKey()) throw new Error('CurseForge 免 Key 不能浏览热门，请输入精确项目名或项目链接');
          const r = await API.curseforge.search({ query: q, kind: 'mod', gameVersion, loader });
          if (r && r.ok === false) throw new Error(r.error || 'CurseForge 搜索失败');
          if (pd[meta.key + 'Token'] !== token) return;
          pd.modSearchKeyless = !!r.keyless;
          pd[meta.key] = { hits: r.hits || [], total: r.total || 0 };
        } else {
          const r = await API.modrinth.search({
            query: q,
            type: meta.type,
            gameVersion,
            loader: meta.type === 'mod' ? loader : '',
            limit: 18,
            sort: q ? 'relevance' : 'downloads',
          });
          if (pd[meta.key + 'Token'] !== token) return;
          pd[meta.key] = r;
        }
        pd[meta.key + 'Error'] = '';
      } catch (e) {
        if (pd[meta.key + 'Token'] !== token) return;
        const msg = String(e.message || e).replace(/^Error invoking remote method .*?: /, '');
        PCL.toast('搜索失败：' + msg, 'error');
        pd[meta.key] = { hits: [] };
        pd[meta.key + 'Error'] = msg;
      } finally {
        if (pd[meta.key + 'Token'] === token) {
          pd[meta.key + 'Loading'] = false;
          PCL.render().then(() => {
            const i = PCL.$('#searchInput');
            if (i) i.value = q;
          });
        }
      }
    };

    PCL.$$('[data-cfsrc]', root).forEach((el) =>
      el.addEventListener('click', () => {
        pd.modSource = el.dataset.cfsrc;
        pd.modSearch = null;
        pd.modSearchLoading = false;
        pd.modSearchError = '';
        pd.modSearchAuto = !!String(pd[meta.queryKey] || '').trim() && (el.dataset.cfsrc !== 'curseforge' || hasCfKey());
        PCL.render();
      })
    );
    PCL.$('#btnSearch', root)?.addEventListener('click', doSearch);
    PCL.$('[data-retry]', root)?.addEventListener('click', doSearch);
    input?.addEventListener('keydown', (e) => e.key === 'Enter' && doSearch());

    PCL.$$('[data-install]', root).forEach((btn) =>
      btn.addEventListener('click', async () => {
        const card = btn.closest('.result-card');
        btn.disabled = true;
        btn.textContent = '下载中…';
        const kind = meta.type;
        const src = source();
        try {
          const r = src === 'curseforge'
            ? await API.curseforge.install({
                projectId: btn.dataset.install,
                fileId: btn.dataset.file,
                title: card.dataset.title,
                kind: 'mod',
                versionId: state.settings.version,
                gameVersion: gameVersionOfCurrent(state),
                loader: loaderOfCurrent(state),
              })
            : await API.modrinth.install({
                idOrSlug: btn.dataset.install,
                title: card.dataset.title,
                kind,
                versionId: state.settings.version,
                gameVersion: gameVersionOfCurrent(state),
                loader: loaderOfCurrent(state),
              });
          if (r && r.ok === false) throw new Error(r.error || '下载失败');
          const deps = Array.isArray(r && r.dependencies) ? r.dependencies.length : 0;
          PCL.toast(`已下载 ${card.dataset.title}${deps ? `，并安装 ${deps} 个必需前置` : ''}`, 'success', deps ? 3200 : 1800);
        } catch (e) {
          PCL.toast('下载失败：' + String(e.message || e).replace(/^Error invoking remote method .*?: /, ''), 'error', 4500);
        } finally {
          btn.disabled = false;
          btn.textContent = '下载';
        }
      })
    );

    if (pd[meta.key + 'Auto']) {
      pd[meta.key + 'Auto'] = false;
      setTimeout(doSearch, 0);
    } else if (!String(pd[meta.queryKey] || '').trim() && !pd[meta.key] && !pd[meta.key + 'Error'] && !pd[meta.key + 'Loading']) {
      loadHotContent(state, tab);
    }
  }

    const source = pd.packSource || 'modrinth';
    const hasCfKey = !!(state.settings && state.settings.curseForgeApiKey && String(state.settings.curseForgeApiKey).trim());
    if (source === 'curseforge' && !hasCfKey) {
      pd.packSearch = null;
      pd.packError = 'CurseForge 免 Key 不能浏览热门整合包，只支持精确项目名或链接搜索。';
      PCL.render();
      return;
    }
    const token = (pd.packToken || 0) + 1;
    pd.packToken = token;
    pd.packLoading = true;
    pd.packError = '';
    try {
      if (source === 'curseforge') {
        const r = await API.curseforge.search({ query: '', kind: 'modpack', gameVersion: gameVersionOfCurrent(state), loader: loaderOfCurrent(state) });
        if (r && r.ok === false) throw new Error(r.error || 'CurseForge 热门整合包加载失败');
        if (pd.packToken !== token) return;
        pd.packSearch = { hits: r.hits || [], total: r.total || 0 };
      } else {
        const r = await API.modrinth.search({ query: '', type: 'modpack', limit: 12, sort: 'downloads' });
        if (pd.packToken !== token) return;
        pd.packSearch = r;
      }
    } catch (e) {
      if (pd.packToken !== token) return;
      pd.packSearch = null;
      pd.packError = String(e.message || e).replace(/^Error invoking remote method .*?: /, '');
    } finally {
      if (pd.packToken === token) {
        pd.packLoading = false;
        PCL.render();
      }
    }
  }

  function mountPack(root, state) {
    const pd = state.pageData;
    const source = () => (pd.packSource || 'modrinth');
    const hasCfKey = () => !!(state.settings && state.settings.curseForgeApiKey && String(state.settings.curseForgeApiKey).trim());
    const input = PCL.$('#packInput', root);
    const search = async () => {
      const q = input.value.trim();
      pd.packQuery = q;
      pd.packError = '';
      const btn = PCL.$('#btnPackSearch', root);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '搜索中…';
      }
      const token = (pd.packToken || 0) + 1;
      pd.packToken = token;
      pd.packLoading = true;
      try {
        if (source() === 'curseforge') {
          if (!q && !hasCfKey()) throw new Error('CurseForge 免 Key 不能浏览热门整合包，请输入精确项目名或项目链接');
          const r = await API.curseforge.search({ query: q, kind: 'modpack', gameVersion: gameVersionOfCurrent(state), loader: loaderOfCurrent(state) });
          if (r && r.ok === false) throw new Error(r.error || 'CurseForge 搜索失败');
          if (pd.packToken !== token) return;
          pd.packSearch = { hits: r.hits || [], total: r.total || 0 };
        } else {
          pd.packSearch = await API.modrinth.search({ query: q, type: 'modpack', limit: 12, sort: q ? 'relevance' : 'downloads' });
          if (pd.packToken !== token) return;
        }
        pd.packError = '';
      } catch (e) {
        if (pd.packToken !== token) return;
        pd.packError = String(e.message || e).replace(/^Error invoking remote method .*?: /, '');
        pd.packSearch = null;
        PCL.toast('整合包搜索失败：' + pd.packError, 'error', 4500);
      } finally {
        if (pd.packToken === token) {
          pd.packLoading = false;
          PCL.render().then(() => {
            const i = PCL.$('#packInput');
            if (i) i.value = q;
          });
        }
      }
    };
    PCL.$$('[data-pksrc]', root).forEach((el) =>
      el.addEventListener('click', () => {
        pd.packSource = el.dataset.pksrc;
        pd.packSearch = null;
        pd.packLoading = false;
        pd.packError = '';
        pd.packAuto = !!String(pd.packQuery || '').trim() && (el.dataset.pksrc !== 'curseforge' || hasCfKey());
        PCL.render();
      })
    );
    PCL.$('#btnPackSearch', root)?.addEventListener('click', search);
    PCL.$('[data-retry]', root)?.addEventListener('click', search);
    input?.addEventListener('keydown', (e) => e.key === 'Enter' && search());

    PCL.$('#btnLocalPack', root)?.addEventListener('click', async () => {
      const file = await API.install.choosePack();
      if (!file) return;
      try {
        const r = await API.install.pack(file);
        if (r && r.ok === false) throw new Error(r.error || '安装失败');
        if (r && r.id) {
          state.versions = await API.versions.list();
          await PCL.saveSettings({ version: r.id });
          PCL.toast(`整合包已安装：${r.id}`, 'success', 4000);
          PCL.render();
        }
      } catch (e) {
        PCL.toast('安装整合包失败：' + String(e.message || e).replace(/^Error invoking remote method .*?: /, ''), 'error', 5000);
      }
    });

    PCL.$$('[data-install]', root).forEach((btn) =>
      btn.addEventListener('click', async () => {
        const card = btn.closest('.result-card');
        btn.disabled = true;
        btn.textContent = '安装中…';
        try {
          // 这里必须安装整个整合包，而不是把 .mrpack 当 Mod 丢进 mods 文件夹
          const r = source() === 'curseforge'
            ? await API.curseforge.installPackProject({
                projectId: btn.dataset.install,
                fileId: btn.dataset.file,
                title: card.dataset.title,
              })
            : await API.modrinth.installPackProject({
                idOrSlug: btn.dataset.install,
                title: card.dataset.title,
              });
          if (r && r.ok === false) throw new Error(r.error || '安装失败');
          if (r && r.id) {
            state.versions = await API.versions.list();
            await PCL.saveSettings({ version: r.id });
            PCL.toast(`整合包已安装：${r.id}`, 'success', 4500);
            PCL.render();
          }
        } catch (e) {
          PCL.toast('安装整合包失败：' + String(e.message || e).replace(/^Error invoking remote method .*?: /, ''), 'error', 5000);
        } finally {
          btn.disabled = false;
          btn.textContent = '安装';
        }
      })
    );

    if (pd.packAuto) {
      pd.packAuto = false;
      setTimeout(search, 0);
    } else if (!String(pd.packQuery || '').trim() && !pd.packSearch && !pd.packError && !pd.packLoading) {
      loadPackHot(state);
    }
  }

  /* ---------------------- 游戏版本选择器（全部版本） ---------------------- */
  const TYPE_LABEL = { release: '正式版', snapshot: '快照', old_beta: '远古 Beta', old_alpha: '远古 Alpha' };
  const TYPE_CLASS = { release: 'release', snapshot: 'snapshot', old_beta: 'old', old_alpha: 'old' };

  function pickGameVersion(state) {
    const pd = state.pageData;
    if (!pd.manifest) return PCL.toast('版本清单还在加载', 'error');
    const all = pd.versionsAll || pd.gameVersions || [];
    const installedIds = (state.versions || []).map((v) => v.id);

    let kw = '';
    let type = 'all';

    const m = PCL.modal({
      title: '选择游戏版本',
      width: 620,
      body: `<div class="search-bar" style="margin-bottom:10px">
          <input class="input" id="vpSearch" placeholder="搜索版本号，例如 1.21、1.7.10、23w" />
        </div>
        <div class="flex gap-8" id="vpChips" style="margin-bottom:10px">
          ${['all', 'release', 'snapshot', 'old']
            .map(
              (t) =>
                `<button class="btn small ${t === type ? 'primary' : ''}" data-type="${t}">${
                  t === 'all' ? '全部' : t === 'release' ? '正式版' : t === 'snapshot' ? '快照' : '远古版本'
                }</button>`
            )
            .join('')}
        </div>
        <div id="vpList" style="max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px"></div>
        <div class="tiny muted mt-8" id="vpCount"></div>`,
      footer: `<button class="btn primary" data-close>关闭</button>`,
      onMount: (wrap, close) => {
        const list = wrap.querySelector('#vpList');
        const count = wrap.querySelector('#vpCount');
        const search = wrap.querySelector('#vpSearch');

        const draw = () => {
          const q = kw.toLowerCase();
          const rows = all.filter((v) => {
            if (q && !v.id.toLowerCase().includes(q)) return false;
            if (type !== 'all') {
              if (type === 'old') return v.type === 'old_beta' || v.type === 'old_alpha';
              return v.type === type;
            }
            return true;
          });
          count.textContent = `共 ${rows.length} 个版本 · 点击一行即可选用`;
          list.innerHTML = rows.length
            ? rows
                .map(
                  (v) => `<div class="row" data-vid="${PCL.esc(v.id)}" style="cursor:pointer;padding:8px 12px">
                  ${PCL.blockIcon(PCL.blockKind(v), 'sm')}
                  <span class="tag ${TYPE_CLASS[v.type] || 'snapshot'}" style="flex:0 0 auto">${TYPE_LABEL[v.type] || v.type}</span>
                  <div class="row-main">
                    <div class="row-title">${PCL.esc(v.id)}</div>
                    <div class="row-desc">发布于 ${PCL.fmtTime(v.releaseTime)}</div>
                  </div>
                  ${installedIds.includes(v.id) ? '<span class="tag" style="background:#eefaf3;border-color:#bfe6d2;color:#2fa060">已安装</span>' : ''}
                </div>`
                )
                .join('')
            : '<div class="empty">没有匹配的版本</div>';
          PCL.$$('#vpList [data-vid]', wrap).forEach((row) =>
            row.addEventListener('click', () => {
              pd.gameVersion = row.dataset.vid;
              pd.forgeVersions = null;
              pd.neoVersions = null;
              close();
              PCL.render();
            })
          );
        };

        search.addEventListener('input', () => {
          kw = search.value.trim();
          draw();
        });
        PCL.$$('#vpChips [data-type]', wrap).forEach((b) =>
          b.addEventListener('click', () => {
            type = b.dataset.type;
            PCL.$$('#vpChips [data-type]', wrap).forEach((x) => x.classList.toggle('primary', x.dataset.type === type));
            draw();
          })
        );
        draw();
      },
    });
    return m;
  }

  PCL.pickGameVersion = pickGameVersion;

})();

/* ============================ 联机 ============================ */
(function () {
  const P = (window.PCLPages = window.PCLPages || {});
  const API = window.API;

  P.multiplayer = {
    render(state) {
      const srv = state.lanServers || [];
      const scanning = !!state.pageData.lanScanning;

      const list = srv.length
        ? srv
            .map(
              (s, i) => `<div class="server-card" data-srv="${i}">
            <div class="vicon" style="background:linear-gradient(160deg,#8ab4e8,#3f74b5);width:38px;height:38px">LAN</div>
            <div class="grow" style="min-width:0">
              <div class="motd ellipsis">${PCL.esc(s.motd)}</div>
              <div class="addr">127.0.0.1:${s.port}</div>
            </div>
            <button class="btn small" data-copy="${PCL.esc(s.motd)}:${s.port}">复制地址</button>
          </div>`
            )
            .join('')
        : `<div class="empty">${
            scanning ? '正在监听局域网广播…<br/><span class="tiny">请在游戏内按 Esc → 对局域网开放</span>' : '尚未发现局域网房间'
          }</div>`;

      return `
      <div class="lan-head">
        <div>
          <div class="dl-head" style="margin:0">
            <div>
              <div class="title">局域网联机</div>
              <div class="desc">监听 Minecraft 的 UDP 4445 广播，自动发现同一网络内「对局域网开放」的世界。</div>
            </div>
          </div>
        </div>
        <div class="flex gap-8 center">
          <span class="lan-status"><span class="dot" style="background:${scanning ? 'var(--success)' : '#c3cedb'};box-shadow:${scanning ? '0 0 0 3px rgba(47,160,96,.15)' : 'none'}"></span>${scanning ? '监听中' : '未开启'}</span>
          <button class="btn ${scanning ? '' : 'primary'}" id="btnLan">${scanning ? '停止监听' : '开始扫描'}</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">发现的房间 <span class="sub">${srv.length} 个</span></div>
        ${list}
      </div>

      <div class="card mt-12">
        <div class="card-title">手动连接</div>
        <div class="search-bar" style="margin-bottom:0">
          <input class="input" id="lanAddr" placeholder="服务器地址，例如 192.168.1.20:25565" />
          <button class="btn" id="btnCopyAddr">复制地址</button>
        </div>
        <div class="tiny muted mt-12" style="line-height:1.8">
          多人游戏 → 直接连接 → 粘贴地址即可进入。若房主勾选了「在线模式」，则需要正版账号才能进入。
        </div>
      </div>

      <div class="card mt-12">
        <div class="card-title">联机小贴士</div>
        <div class="tiny sub" style="line-height:1.9">
          1. 确保双方在同一局域网（或已通过内网穿透工具互联）。<br/>
          2. 房主在游戏内 Esc → 对局域网开放，端口随机分配，本页会自动读取。<br/>
          3. 若系统防火墙拦截 UDP，可能无法发现房间，此时请手动填写地址。
        </div>
      </div>`;
    },

    mount(root, state) {
      const btn = PCL.$('#btnLan', root);
      if (btn)
        btn.addEventListener('click', async () => {
          state.pageData.lanScanning = !state.pageData.lanScanning;
          if (state.pageData.lanScanning) {
            await API.lan.start();
            PCL.toast('已开始监听局域网广播', 'success', 1800);
          } else {
            await API.lan.stop();
            state.lanServers = [];
          }
          PCL.render();
        });

      PCL.$$('[data-copy]', root).forEach((b) =>
        b.addEventListener('click', () => copy(b.dataset.copy))
      );
      PCL.$('#btnCopyAddr', root)?.addEventListener('click', () => {
        const v = PCL.$('#lanAddr', root).value.trim();
        if (!v) return PCL.toast('请输入地址', 'error');
        copy(v);
      });

      PCL.$$('.server-card', root).forEach((c) =>
        c.addEventListener('dblclick', () => {
          const a = c.querySelector('.addr');
          if (a) copy(a.textContent);
        })
      );
    },
  };

  function copy(text) {
    navigator.clipboard.writeText(text).then(
      () => PCL.toast('已复制：' + text, 'success', 1800),
      () => PCL.toast('复制失败，请手动选择文本', 'error')
    );
  }
})();

/* ============================ 设置 ============================ */
(function () {
  const P = (window.PCLPages = window.PCLPages || {});
  const API = window.API;

  const TABS = [
    { id: 'game', label: '游戏', icon: 'leaf' },
    { id: 'personal', label: '个性化', icon: 'brush' },
    { id: 'launcher', label: '启动器', icon: 'window' },
    { id: 'network', label: '联机', icon: 'wifi' },
  ];

  const COLORS = ['#1e6fd9', '#2e9e6b', '#e07a2c', '#c94b4b', '#7a5cd6', '#2b3a4d'];

  P.settings = {
    sidebar: true,
    render(state) {
      const pd = state.pageData;
      const tab = pd.setTab || 'game';
      const s = state.settings || {};
      const side = TABS.map(
        (t) =>
          `${t.div ? `<div class="divider">${t.div}</div>` : ''}
           <div class="item ${tab === t.id ? 'active' : ''}" data-tab="${t.id}">${Icons[t.icon]}<span>${t.label}</span></div>`
      ).join('');

      let body = '';
      if (tab === 'game') body = gameHtml(state, s);
      else if (tab === 'personal') body = personalHtml(state, s);
      else if (tab === 'network') body = networkHtml(state, s);
      else body = launcherHtml(state, s);

      return `<div class="sidebar">${side}</div><div class="grow" style="overflow-y:auto">${body}</div>`;
    },

    mount(root, state) {
      PCL.$$('.sidebar .item', root).forEach((it) =>
        it.addEventListener('click', async () => {
          state.pageData.setTab = it.dataset.tab;
          if (state.pageData.setTab === 'game' && !state.pageData.javaList) await detectJava(state);
          PCL.render();
        })
      );

      const tab = state.pageData.setTab || 'game';
      if (tab === 'game' && !state.pageData.javaList) {
        detectJava(state).then(() => {
          if (state.page === 'settings') PCL.render();
        });
      }
      if (tab === 'game' && !state.pageData.javaCatalog) {
        API.java
          .catalog()
          .then((list) => {
            state.pageData.javaCatalog = list;
            if (state.page === 'settings') PCL.render();
          })
          .catch(() => {});
      }
      if (tab === 'game') mountGame(root, state);
      else if (tab === 'personal') mountPersonal(root, state);
      else if (tab === 'network') mountNetwork(root, state);
      else mountLauncher(root, state);
    },
  };

  /* ---------------------- 游戏 ---------------------- */

              ${javaOptions || '<option value="">未检测到 Java</option>'}
              ${!javas.length && currentJava ? `<option value="${PCL.esc(currentJava)}" selected>手动指定</option>` : ''}
            </select>
            <button class="btn small" id="btnDetectJava">${Icons.refresh}自动寻找 Java</button>

      </div>

      <div class="card settings-card mt-12">
        <div class="card-title">内存</div>
        <div class="mem-head"><span>分配给游戏的内存</span><span id="memLabel" class="mem-value">${memText}</span></div>
        <input class="mem-range" id="setMemRange" type="range" min="512" max="8192" step="256" value="${memVal}" />
        <div class="mem-scale"><span>512 MB</span><span>物理内存 ${Math.round((s.totalMem || 0) / 1024)} GB</span><span>8192 MB</span></div>
      </div>`;
  }

  function mountGame(root, state) {
    PCL.$$('[data-skin]', root).forEach((el) =>
      el.addEventListener('click', async () => {
        if (el.dataset.skin === 'custom' && !state.settings.skinFile) {
          const r = await API.personal.pickSkin();
          if (!r.ok) {
            if (!r.cancelled) PCL.toast(r.error || '选择皮肤失败', 'error');
            return;
          }
          PCL.toast('已选择自定义皮肤', 'success');
          PCL.render();
          return;
        }
        await PCL.saveSettings({ skinModel: el.dataset.skin });
        PCL.render();
      })
    );
    PCL.$('#setSkinPick', root)?.addEventListener('click', async () => {
      const r = await API.personal.pickSkin();
      if (!r.ok) {
        if (!r.cancelled) PCL.toast(r.error || '选择皮肤失败', 'error');
        return;
      }
      PCL.toast('已选择自定义皮肤', 'success');
      PCL.render();

      await PCL.saveSettings({ skinFile: '', skinModel: 'steve' });

      PCL.render();
    });

    PCL.$('#setGameTitle', root)?.addEventListener('change', (e) => PCL.saveSettings({ gameTitle: e.target.value.trim() }));
    PCL.$('#setCustomInfo', root)?.addEventListener('change', (e) => PCL.saveSettings({ customInfo: e.target.value.trim() }));
    PCL.$('#setIsolation', root)?.addEventListener('change', (e) => {
      PCL.saveSettings({ versionIsolation: e.target.value === '1' });
      state.settings.versionIsolation = e.target.value === '1';
    });
    PCL.$('#setVisibility', root)?.addEventListener('change', (e) => PCL.saveSettings({ launcherVisibility: e.target.value }));
    PCL.$('#setPriority', root)?.addEventListener('change', (e) => PCL.saveSettings({ processPriority: e.target.value }));
    PCL.$('#setFullscreen', root)?.addEventListener('change', (e) => PCL.saveSettings({ fullscreen: e.target.value === '1' }));
    PCL.$('#setWindowMode', root)?.addEventListener('change', (e) => {
      PCL.saveSettings({ windowMode: e.target.value });
      PCL.render();
    });

    PCL.$('#setH', root)?.addEventListener('change', (e) => PCL.saveSettings({ gameHeight: Number(e.target.value) || 480 }));

    const range = PCL.$('#setMemRange', root);
    if (range) {
      const label = PCL.$('#memLabel', root);
      range.addEventListener('input', () => {
        if (label) label.textContent = `${range.value} MB`;
      });
      range.addEventListener('change', () => PCL.saveSettings({ maxMemory: Number(range.value) || 0 }));
    }

    PCL.$('#setJavaSelect', root)?.addEventListener('change', async (e) => {
      await PCL.saveSettings({ javaPath: e.target.value });
      PCL.toast('已切换 Java', 'success', 1600);
      PCL.render();

    PCL.$('#btnDetectJava', root)?.addEventListener('click', () => detectJava(state, true));
    PCL.$('#btnJavaManage', root)?.addEventListener('click', () => javaManageModal(state));

  function javaManageModal(state) {
    const list = state.pageData.javaList || [];
    const rows = list.length
      ? list
          .map(
            (j) => `<div class="java-item" data-pick-java="${PCL.esc(j.path)}" style="cursor:pointer">
              <span class="tag">Java ${j.major}</span>
              ${j.managed ? '<span class="tag" style="background:#eaf6ee;border-color:#bfe3cb;color:#2c7a4b">启动器安装</span>' : ''}
              ${j.source && j.source !== 'PATH' ? `<span class="tag" style="background:#f5f7fa;border-color:#e2e6eb;color:#6b7785">${PCL.esc(j.source)}</span>` : ''}
              <span class="grow ellipsis" style="font-size:11.5px">${PCL.esc(j.path)}</span>
              <span class="tiny muted">${PCL.esc(j.output || '')}</span>
            </div>`
          )
          .join('')
      : '<div class="tiny muted">未检测到本机 Java</div>';

    PCL.modal({
      title: 'Java 管理',
      width: 600,
      body: `
        <div class="card-title" style="font-size:12px;margin-bottom:8px">已检测到的 Java</div>
        <div class="java-list">${rows}</div>
        <div class="card-title mt-12" style="font-size:12px">自动安装（Adoptium Temurin JDK）</div>
        <div class="flex gap-8 mt-8" style="flex-wrap:wrap">
          <button class="btn" data-install-java="8">Java 8</button>
          <button class="btn" data-install-java="17">Java 17</button>
          <button class="btn primary" data-install-java="21">Java 21（推荐）</button>
          <button class="btn" data-install-java="25">Java 25</button>
        </div>
        <div class="tiny muted mt-8">下载后自动解压到启动器目录并设为默认，约 100–200 MB。</div>`,
      footer: '<button class="btn primary" data-close>完成</button>',
      onMount: (wrap, close) => {
        PCL.$$('[data-pick-java]', wrap).forEach((el) =>
          el.addEventListener('click', async () => {
            await PCL.saveSettings({ javaPath: el.dataset.pickJava });
            close();
            PCL.toast('已切换 Java', 'success', 1600);
            PCL.render();
          })
        );
        PCL.$$('[data-install-java]', wrap).forEach((btn) =>
          btn.addEventListener('click', async () => {
            const major = Number(btn.dataset.installJava);
            const label = btn.textContent;
            btn.disabled = true;
            btn.textContent = `下载 Java ${major} 中…`;
            try {
              const r = await API.java.download(major);
              if (r && r.ok === false) throw new Error(r.error || '下载失败');
              state.pageData.javaList = await API.java.detect();
              await PCL.saveSettings({ javaPath: r.path });
              close();
              PCL.toast(`Java ${major} 安装完成，已设为默认`, 'success', 2600);
            } catch (err) {
              PCL.toast(String(err.message || err).replace(/^Error invoking remote method .*?: /, ''), 'error', 5000);
              btn.disabled = false;
              btn.textContent = label;
            }
            PCL.render();
          })
        );
      },
    });
  }

  async function detectJava(state, force) {
    if (state.pageData.javaList && !force) return;
    try {
      const list = force
        ? await API.java.detect()
        : PCL.javaScan
          ? await PCL.javaScan
          : await API.java.detect();
      state.pageData.javaList = Array.isArray(list) ? list : [];
    } catch (e) {
      state.pageData.javaList = [];
    }
    if (force) {
      PCL.javaScan = Promise.resolve(state.pageData.javaList);
      PCL.render();
      const n = state.pageData.javaList.length;
      PCL.toast(n ? `自动找到 ${n} 个 Java` : '没有找到已有 Java，可以点“自动安装”', n ? 'success' : 'error', 2400);
    }
  }
