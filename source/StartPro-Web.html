  function mountLauncher(root, state) {
    const AI_PRESETS = {
      deepseek: { base: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
      openai: { base: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
      ollama: { base: 'http://127.0.0.1:11434/v1', model: 'qwen2.5:7b' },
    };
    const aiField = (id) => PCL.$(`#${id}`, root);
    const saveAiFields = async () => {
      if (!aiField('setAiBase')) return PCL.state.settings;
      return PCL.saveSettings({
        aiProvider: aiField('setAiProvider')?.value || 'custom',
        aiBaseUrl: aiField('setAiBase')?.value.trim() || '',
        aiApiKey: aiField('setAiKey')?.value.trim() || '',
        aiModel: aiField('setAiModel')?.value.trim() || '',
      });
    };

    PCL.$('#setAiProvider', root)?.addEventListener('change', async (e) => {
      const preset = AI_PRESETS[e.target.value];
      if (preset) {
        aiField('setAiBase').value = preset.base;
        aiField('setAiModel').value = preset.model;
      }
      await saveAiFields();
      PCL.toast('AI 接口预设已切换', 'success', 1600);
    });
    ['setAiBase', 'setAiKey', 'setAiModel'].forEach((id) =>
      aiField(id)?.addEventListener('change', () => saveAiFields())
    );
    PCL.$('#btnAiModels', root)?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = '读取中…';
      await saveAiFields();
      const r = await API.ai.models();
      btn.disabled = false;
      btn.textContent = '刷新模型';
      if (!r.ok) {
        PCL.toast(r.error || '读取模型列表失败', 'error', 6000);
        return;
      }
      const list = PCL.$('#aiModelList', root);
      if (list) list.innerHTML = (r.models || []).map((m) => `<option value="${PCL.esc(m)}"></option>`).join('');
      if ((r.models || []).length && !aiField('setAiModel').value) {
        aiField('setAiModel').value = r.models[0];
        await saveAiFields();
      }
      PCL.toast(`已读取 ${r.models.length} 个模型`, 'success', 2200);
    });
    PCL.$('#btnAiTest', root)?.addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = '测试中…';
      await saveAiFields();
      const r = await API.ai.test();
      btn.disabled = false;
      btn.textContent = '测试连接';
      if (!r.ok) {
        PCL.toast(r.error || 'AI 连接失败', 'error', 7000);
        return;
      }
      PCL.toast(`AI 连接成功：${r.reply || 'OK'}`, 'success', 4000);
    });

    PCL.$('#btnPickDir', root)?.addEventListener('click', async () => {
      const dir = await API.dir.choose();
      if (dir) {
        await PCL.saveSettings({ gameDir: dir });
        state.settings = await API.settings.get();
        state.folders = await API.folders.list().catch(() => state.folders || []);
        state.versions = await API.versions.list();
        PCL.render();
      }
    });
    PCL.$('#setGameDir', root)?.addEventListener('change', async (e) => {
      await PCL.saveSettings({ gameDir: e.target.value.trim() });
      state.settings = await API.settings.get();
      state.folders = await API.folders.list().catch(() => state.folders || []);
      state.versions = await API.versions.list();
      PCL.toast('游戏目录已更新', 'success', 1600);
      PCL.render();
    });
    PCL.$$('input[name="mirror"]', root).forEach((r) =>
      r.addEventListener('change', async () => {
        await PCL.saveSettings({ mirror: r.value });
        PCL.toast('下载源已切换', 'success', 1600);
      })
    );
    PCL.$('#setLogLevel', root)?.addEventListener('change', (e) => PCL.saveSettings({ logLevel: e.target.value }));
    PCL.$('#setUpdateUrl', root)?.addEventListener('change', (e) => {
      PCL.saveSettings({ updateManifestUrl: e.target.value.trim() });
      PCL.toast('更新清单地址已保存', 'success', 1600);
    });
    PCL.$('#setCfKey', root)?.addEventListener('change', (e) => {
      PCL.saveSettings({ curseForgeApiKey: e.target.value.trim() });
      PCL.toast('CurseForge API Key 已保存', 'success', 1600);
    });
    PCL.$('#btnCfKey', root)?.addEventListener('click', () =>
      API.openExternal('https://console.curseforge.com/?#api-keys')
    );
    PCL.$('#setMsClientId', root)?.addEventListener('change', (e) => {
      PCL.saveSettings({ msClientId: e.target.value.trim() });
      PCL.toast('微软登录 Client ID 已保存', 'success', 1600);
    });
    bindSwitch(root, 'versionIsolation', state);
    bindSwitch(root, 'autoCheckUpdates', state);
    bindSwitch(root, 'aiEnabled', state);
  }

  function bindSwitch(root, key, state) {
    PCL.$$(`[data-switch="${key}"]`, root).forEach((el) =>
      el.addEventListener('click', async () => {
        el.classList.toggle('on');
        const on = el.classList.contains('on');
        await PCL.saveSettings({ [key]: on });
        if (key === 'autoCheckUpdates' && PCL.updateAuto) {
          clearTimeout(PCL.updateAuto.timer);
          if (!on) {
            PCL.updateAuto.timer = null;
          } else if (!PCL.updateAuto.checked && typeof PCL.autoUpdateTick === 'function') {
            PCL.updateAuto.timer = setTimeout(PCL.autoUpdateTick, 1200);
          }
        }
        if (key === 'versionIsolation') {
          state.settings.versionIsolation = el.classList.contains('on');
          PCL.$$(`[data-switch="versionIsolation"]`, root).forEach((x) => x.classList.toggle('on', el.classList.contains('on')));
        }
      })
    );
  }
})();

      if (auto) return r;
      PCL.modal({
        title: '检查更新',

        onMount: (wrap) => wrap.querySelector('[data-open-update]')?.addEventListener('click', () => API.update.openDir()),
      });
      return r;
    }
    if (!r.hasUpdate) {
      if (!auto) PCL.toast(`已是最新版本 ${r.current}`, 'success', 2400);
      return r;
    }
    if (auto && PCL.state.page !== 'home') {

      footer: `<button class="btn" data-open-update>打开更新目录</button><button class="btn" data-dl-update>仅下载</button><button class="btn primary" data-install-update>立即更新并重启</button>`,

            return;
          }

        wrap.querySelector('[data-install-update]')?.addEventListener('click', async (e) => {
          const btn = e.currentTarget;

    if (!r.ok) {
      PCL.modal({
        title: '崩溃分析',

        body: `<div style="font-size:13px;line-height:1.9">${PCL.esc(r.error || '没有可分析的日志')}</div>`,

      });
      return;
    }
    const causes = (r.causes || []).length
      ? r.causes.map((l) => `<div class="crash-line">${PCL.esc(l)}</div>`).join('')
      : '<div class="tiny muted">日志里没有提取到明确的 Caused by 行。</div>';
    const tips = (r.tips || []).map((t) => `<li>${PCL.esc(t)}</li>`).join('');

      title: '崩溃分析',
      width: 760,
      body: `

/* ============================================================
   全面检查：运行环境、文件完整性、Java、网络、账号、日志
   ============================================================ */
(function () {
  const PCL = window.PCL;
  const API = window.API;

  const GROUP_NAMES = {
    runtime: '运行环境',
    files: '文件与磁盘',
    version: '版本完整性',
    java: 'Java',
    settings: '启动设置',
    account: '账号',
    network: '网络与镜像',
    log: '运行日志',
    app: '启动器',
  };
  const DOT = { pass: '✓', warn: '!', fail: '×', info: 'i' };
  let lastResult = null;
  let closeModal = null;

  function esc(s) { return PCL.esc(s); }

  function hero(result) {
    const cls = result.counts.fail ? 'fail' : result.counts.warn ? 'warn' : '';
    const title = result.counts.fail
      ? `发现 ${result.counts.fail} 个必须处理的问题`
      : result.counts.warn
        ? `发现 ${result.counts.warn} 个建议优化项`
        : '全部通过，可以放心启动';
    return `<div class="dg-hero ${cls}">
      <div class="dg-score">${result.score}<small>分</small></div>
      <div class="dg-hero-main">
        <div class="dg-hero-title">${esc(title)}</div>
        <div class="dg-hero-sub">检查了运行环境、版本文件、Java、内存、账号、网络与最近日志。</div>
      </div>
      <div class="dg-counts">
        <div class="dg-count"><b>${result.counts.pass}</b>通过</div>
        <div class="dg-count warn"><b>${result.counts.warn}</b>警告</div>
        <div class="dg-count fail"><b>${result.counts.fail}</b>失败</div>
      </div>
    </div>`;
  }

  function rows(result) {
    const groups = {};
    for (const c of result.checks) (groups[c.group] || (groups[c.group] = [])).push(c);
    return Object.entries(groups).map(([g, list]) => `
      <div class="dg-group-title">${esc(GROUP_NAMES[g] || g)}</div>
      ${list.map((c) => `<div class="dg-row">
        <span class="dg-dot ${c.status}">${DOT[c.status] || 'i'}</span>
        <div class="dg-main">
          <div class="dg-title">${esc(c.title)}</div>
          <div class="dg-detail">${esc(c.detail)}</div>
        </div>
        ${c.fix ? `<button class="dg-fix" data-dg-fix="${esc(c.id)}">${esc(c.fix.label)}</button>` : ''}
      </div>`).join('')}
    `).join('');
  }

  function setLoading(wrap) {
    lastResult = null;
    wrap.querySelector('#dgHero').innerHTML = '';
    wrap.querySelector('#dgBody').innerHTML = `<div class="dg-loading">
      <div class="dg-spinner"></div>
      <div>正在全面检查…</div>
      <div class="dg-steps">运行环境 → 游戏目录 → 版本文件 → Java → 网络 → 日志</div>
    </div>`;
    wrap.querySelector('#dgTime').textContent = '检查中';
  }

  async function run(wrap) {
    setLoading(wrap);
    try {
      if (!API.diagnostics || typeof API.diagnostics.run !== 'function') {
        throw new Error('当前版本没有接入检查引擎');
      }
      const result = await API.diagnostics.run(PCL.state.logs || []);
      lastResult = result;
      wrap.querySelector('#dgHero').innerHTML = hero(result);
      wrap.querySelector('#dgBody').innerHTML = rows(result);
      wrap.querySelector('#dgTime').textContent = '检查于 ' + new Date(result.generatedAt).toLocaleTimeString('zh-CN', { hour12: false });
    } catch (e) {
      wrap.querySelector('#dgHero').innerHTML = `<div class="dg-hero fail">
        <div class="dg-score">0<small>分</small></div>
        <div class="dg-hero-main"><div class="dg-hero-title">检查没有完成</div>
        <div class="dg-hero-sub">${esc(e.message || e)}。可以重试，或查看运行日志。</div></div>
      </div>`;
      wrap.querySelector('#dgBody').innerHTML = `<div class="dg-row">
        <span class="dg-dot fail">×</span>
        <div class="dg-main"><div class="dg-title">检查引擎异常</div>
        <div class="dg-detail">${esc(e.message || e)}</div></div>
      </div>`;
      wrap.querySelector('#dgTime').textContent = '检查失败';
    }
  }

  async function applyFix(fix, wrap) {
    if (!fix) return;
    if (fix.act === 'mirror') {
      try {
        await API.settings.set({ mirror: 'bmclapi' });
        PCL.state.settings.mirror = 'bmclapi';
        PCL.toast('已切换到 BMCLAPI 镜像', 'success', 2200);
        await run(wrap);
      } catch (e) {
        PCL.toast('切换失败：' + (e.message || e), 'error', 3000);
      }
      return;
    }
    if (fix.act === 'settings' || fix.act === 'page') {
      if (closeModal) closeModal();
      if (fix.act === 'settings') {
        if (fix.tab) PCL.state.pageData.setTab = fix.tab;
        await PCL.go('settings');
      } else {
        await PCL.go(fix.page || 'home');
      }
      return;
    }
    if (fix.act === 'openDir') {
      API.versions.open('');
      return;
    }
    if (fix.act === 'showLog') {
      if (closeModal) closeModal();
      const logs = (PCL.state.logs || []).join('\n') || '暂无日志：启动一次游戏后会在这里显示输出。';
      PCL.modal({
        title: '运行日志',
        width: 720,
        body: `<pre style="font:12px/1.7 'Cascadia Mono',Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#f6f9fc;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:420px;overflow:auto;user-select:text">${esc(logs)}</pre>`,
        footer: '<button class="btn primary" data-close>关闭</button>',
      });
    }
  }

  function open() {
    let wrapRef = null;
    const modal = PCL.modal({
      title: '全面检查',
      width: 680,
      body: `<div class="dg-shell">
        <div id="dgHero"></div>
        <div class="dg-body" id="dgBody"></div>
        <div class="dg-footer">
          <span class="dg-time" id="dgTime">准备中</span>
          <button class="btn" data-dg-recheck>重新检查</button>
          <button class="btn primary" data-close>关闭</button>
        </div>
      </div>`,
      onMount: (wrap, close) => {
        wrapRef = wrap;
        closeModal = close;
        wrap.addEventListener('click', (e) => {
          const re = e.target.closest('[data-dg-recheck]');
          if (re) { run(wrap); return; }
          const btn = e.target.closest('[data-dg-fix]');
          if (!btn || !lastResult) return;
          const check = lastResult.checks.find((c) => c.id === btn.dataset.dgFix);
          applyFix(check && check.fix, wrap);
        });
        run(wrap);
      },
    });
    return { modal, wrap: wrapRef };
  }

  PCL.diagnostics = { open, run: () => run(document.querySelector('.dg-shell') || document) };
})();

  function choose(q) {
    const nq = norm(q);
    if (!nq) return null;
    let best = null;
    let bestScore = 0;
    for (const item of KB) {
      let score = 0;
      for (const key of item.keys) {
        const k = norm(key);
        if (!k) continue;
        if (nq === k) score += 30;
        else if (nq.includes(k)) score += k.length * 2 + 2;
        else if (k.includes(nq) && nq.length >= 2) score += nq.length;
      }
      if (score > bestScore) { bestScore = score; best = item; }
    }
    return bestScore >= 4 ? best : null;
  }

  function actionsHtml(m) {
    if (!m.actions || !m.actions.length) return '';
    return `<div class="ai-actions">${m.actions.map((a, i) =>
      `<button class="ai-act" data-ai-msg="${PCL.esc(m.id)}" data-ai-act="${i}">${PCL.esc(a.label)}</button>`
    ).join('')}</div>`;
  }

  function aiFormat(text) {
    let s = PCL.esc(String(text || '').trim()).replace(/\r/g, '');
    s = s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, code) => `<pre class="ai-code">${code.replace(/\n+$/, '')}</pre>`);
    s = s.replace(/^#{1,3}\s+(.+)$/gm, '<div class="ai-h">$1</div>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`\n]+)`/g, '<code class="ai-inline">$1</code>');
    return s;
  }

  function messageHtml(m) {
    if (m.role === 'user') {
      return `<div class="ai-row user"><div class="ai-bubble user">${PCL.esc(m.text)}</div></div>`;
    }
    return `<div class="ai-row bot"><div class="ai-avatar">SPL</div><div class="ai-bubble bot"><div class="ai-text">${aiFormat(m.text)}</div>${actionsHtml(m)}</div></div>`;
  }

  function history() {
    if (!PCL.state.assistant) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('ps-assistant-v1') || 'null'); } catch {}
      PCL.state.assistant = {
        messages: Array.isArray(saved && saved.messages) ? saved.messages.slice(-40) : [],
        nextId: (saved && saved.nextId) || 1,
      };
    }
    return PCL.state.assistant;
  }

  function saveHistory() {
    try {
      localStorage.setItem('ps-assistant-v1', JSON.stringify({
        messages: history().messages.slice(-40),
        nextId: history().nextId,
      }));
    } catch {}
  }

  function addMessage(role, text, actions = []) {
    const h = history();
    const m = { id: 'a' + h.nextId++, role, text, actions, time: Date.now() };
    h.messages.push(m);
    if (h.messages.length > 40) h.messages.splice(0, h.messages.length - 40);
    saveHistory();
    return m;
  }

      : '可以问我安装、Java、Mod、登录、版本列表、启动报错；也可以点下面的快捷问题。';
    return `我是 SPL 小助手。\n当前状态：${bits.join(' · ')}。\n\n${guide}`;

  async function runAction(action, msgId, index, wrap) {
    if (!action) return;
    if (action.act === 'ask') {
      const input = wrap.querySelector('#aiInput');
      if (input) { input.value = action.text; input.focus(); }
      await ask(action.text, wrap);
      return;
    }
    if (action.act === 'page' || action.act === 'settings' || action.act === 'more') {
      close();
      const page = action.act === 'settings' ? 'settings' : action.act === 'more' ? 'more' : action.page;
      if (action.tab) {
        if (page === 'settings') PCL.state.pageData.setTab = action.tab;
        else if (page === 'download') PCL.state.pageData.dlTab = action.tab;
        else if (page === 'more') PCL.state.pageData.moreTab = action.tab;
        else if (page === 'versions') PCL.state.pageData.vTab = action.tab;
      }
      await PCL.go(page);
      return;
    }
    if (action.act === 'detectJava') {
      close();
      PCL.toast('正在检测 Java…', 'info', 1800);
      try {
        PCL.state.pageData.javaList = await API.java.detect();
        const list = PCL.state.pageData.javaList || [];
        PCL.toast(list.length ? `检测到 ${list.length} 个 Java` : '没有检测到 Java', list.length ? 'success' : 'error', 3000);
        if (list.length) {
          const majors = [...new Set(list.map((j) => j.major))].join(' / ');
          PCL.toast(`Java 版本：${majors}`, 'info', 2600);
        }
      } catch (e) {
        PCL.toast('检测 Java 失败', 'error', 3000);
      }
      return;
    }
    if (action.act === 'showLog') {
      const logs = (PCL.state.logs || []).join('\n') || '暂无日志：启动一次游戏后会在这里显示输出。';
      PCL.modal({
        title: '运行日志',
        width: 720,
        body: `<pre style="font:12px/1.7 'Cascadia Mono',Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#f6f9fc;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:420px;overflow:auto;user-select:text">${PCL.esc(logs)}</pre>`,
        footer: '<button class="btn primary" data-close>关闭</button>',
      });
      return;
    }
    if (action.act === 'openDir') {
      close();
      API.versions.open('');
      return;
    }
  }

  async function ask(text, wrap) {
    const q = String(text || '').trim();
    if (!q) return;
    const h = history();
    if (PCL.assistant._busy) return;
    PCL.assistant._busy = true;
    PCL.assistant._streaming = false;
    addMessage('user', q);
    PCL.assistant._render(wrap);
    const input = wrap && wrap.querySelector('#aiInput');
    if (input) { input.value = ''; input.focus(); }

    // Java 类问题先自动补一次检测，回答里就能带真实数量
    if (/java|jdk|运行环境/i.test(q) && !(PCL.state.pageData.javaList || []).length) {
      try {
        PCL.state.pageData.javaList = await API.java.detect();
      } catch {}
    }
    await new Promise((r) => setTimeout(r, 160));

    const ctx = context();
    const item = choose(q);
    let answer = null;
    let streamMsg = null;
    let partial = '';
    let streamError = '';
    let onlineDone = false;
    let paintTimer = null;

    if (aiReady()) {
      const paint = () => {
        if (paintTimer) return;
        paintTimer = setTimeout(() => {
          paintTimer = null;
          PCL.assistant._render(wrap);
        }, 70);
      };
      const messages = h.messages.slice(-9).map((m) => ({
        role: m.role === 'assistant' ? 'assistant' : 'user',
        content: m.text,
      }));
      try {
        if (!API.ai || typeof API.ai.stream !== 'function') throw new Error('当前版本不支持流式 AI');
        const r = await API.ai.stream({ messages, context: aiContext() }, (ev) => {
          if (!ev || !ev.delta) return;
          if (!streamMsg) streamMsg = addMessage('assistant', '');
          PCL.assistant._streaming = true;
          streamMsg.text += ev.delta;
          partial += ev.delta;
          paint();
        });
        if (!r || !r.ok) throw new Error((r && r.error) || '在线 AI 返回失败');
        if (!streamMsg && r.text) streamMsg = addMessage('assistant', '');
        if (streamMsg) {
          if (!streamMsg.text) streamMsg.text = r.text || '';
          else if (r.text) streamMsg.text = r.text;
        }
        if (!streamMsg || !streamMsg.text) throw new Error('在线 AI 没有返回内容');
        saveHistory();
        onlineDone = true;
      } catch (e) {
        streamError = String(e.message || e);
      } finally {
        if (paintTimer) { clearTimeout(paintTimer); paintTimer = null; }
      }
    }

    if (onlineDone) {
      // 已经完整生成，文本保持原始 Markdown，渲染时统一格式化
    } else if (streamMsg) {
      // 已经收到一部分内容：保留内容，标注中断，不再用本地答案覆盖
      streamMsg.text += `\n\n（在线 AI 中断：${streamError || '未知错误'}）`;
      saveHistory();
    } else {
      if (item) {
        try { answer = item.run(ctx); } catch { answer = A('这个问题我暂时没组织好答案，可以换个说法，或去「更多 → 帮助」看指南。'); }
      } else {
        answer = A(
          `我暂时没匹配到这个问题。可以换个关键词，例如：\n· 安装 / Fabric / Forge / 整合包\n· Java / 内存 / 版本隔离\n· Mod / 资源包 / 光影\n· 登录 / 正版 / 外置\n· 崩溃 / 列表获取失败 / 日志\n\n也可以点下面的快捷问题。`,
          [
            { label: '安装游戏', act: 'ask', text: '怎么安装游戏' },
            { label: 'Java 怎么选', act: 'ask', text: 'Java 怎么选' },
            { label: '启动崩溃', act: 'ask', text: '游戏崩溃怎么办' },
          ]
        );
      }
      if (streamError) answer.text += `\n\n（在线 AI 暂时不可用：${streamError}）`;
      addMessage('assistant', answer.text, answer.actions || []);
    }
    PCL.assistant._busy = false;
    PCL.assistant._streaming = false;
    PCL.assistant._render(wrap);
  }

  function render(wrap) {
    const h = history();
    const chat = wrap.querySelector('#aiChat');
    if (!chat) return;
    chat.innerHTML = h.messages.map(messageHtml).join('') +
      (PCL.assistant._busy ? `<div class="ai-row bot"><div class="ai-avatar">SPL</div><div class="ai-bubble bot ai-typing"><i></i><i></i><i></i></div></div>` : '');
    chat.scrollTop = chat.scrollHeight;
    const send = wrap.querySelector('#aiSend');
    if (send) {
      send.disabled = !!PCL.assistant._busy;
      send.textContent = PCL.assistant._busy ? '思考中' : '发送';
    }
  }

      title: 'SPL 小助手',
      width: 600,
      body: `
        <div class="ai-shell">
          <div class="ai-status"><span class="ai-pulse"></span>${aiOn ? `在线 AI · ${PCL.esc(model)}` : '本地知识库 · 不联网 · 不上传对话'}<button id="aiGear" style="margin-left:8px;border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:11px;padding:0">AI 设置</button><span class="ai-status-right">${PCL.esc(status)}</span></div>
          <div class="ai-chat" id="aiChat"></div>
          <div class="ai-suggest" id="aiSuggest">
            ${[
              ['安装 Fabric', '怎么安装 Fabric'],
              ['Java 怎么选', 'Java 怎么选'],
              ['列表获取失败', '列表获取失败怎么办'],
              ['Mod 装哪里', 'Mod 装在哪里'],
              ['启动崩溃', '游戏崩溃怎么办'],
              ['内存怎么调', '内存怎么调'],
            ].map(([label, q]) => `<button class="ai-chip" data-ai-q="${PCL.esc(q)}">${PCL.esc(label)}</button>`).join('')}
          </div>
          <div class="ai-input">
            <input id="aiInput" placeholder="问安装、Java、Mod、登录、报错…" autocomplete="off" />
            <button id="aiSend" class="btn primary">发送</button>
          </div>
        </div>`,
      onMount: (wrap, closeFn) => {
        PCL.assistant._close = closeFn;
        PCL.assistant._render = (w) => render(w);
        wrap.querySelector('#aiGear')?.addEventListener('click', async () => {
          closeFn();
          PCL.state.pageData.setTab = 'launcher';
          await PCL.go('settings');
        });
        renderChat(wrap, { assistantBusy: false });
        const input = wrap.querySelector('#aiInput');
        const send = () => ask(input.value, wrap);
        wrap.querySelector('#aiSend').addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); }
        });
        PCL.$$('[data-ai-q]', wrap).forEach((b) =>
          b.addEventListener('click', () => { input.value = b.dataset.aiQ; ask(b.dataset.aiQ, wrap); })
        );
        wrap.addEventListener('click', (e) => {
          const b = e.target.closest('[data-ai-act]');
          if (!b) return;
          const msg = history().messages.find((m) => m.id === b.dataset.aiMsg);
          const act = msg && msg.actions && msg.actions[Number(b.dataset.aiAct)];
          if (act) runAction(act, msg.id, Number(b.dataset.aiAct), wrap);
        });
        setTimeout(() => input.focus(), 40);
      },
    });
    return modal;
  }

  function mountFab() {
    if (PCL.$('#aiFab')) return;
    const btn = document.createElement('button');
    btn.id = 'aiFab';
    btn.className = 'ai-fab';
    btn.innerHTML = '<span class="ai-fab-ico">SPL</span><span>小助手</span><i></i>';
    btn.title = 'SPL 小助手 · 回答启动器问题';
    btn.addEventListener('click', open);
    document.body.appendChild(btn);
  }

  PCL.assistant = { open, close, ask: (q) => { const m = open(); const w = m.el; return ask(q, w); }, mountFab, context };
  window.addEventListener('DOMContentLoaded', () => setTimeout(mountFab, 120));
})();

/* 启动引导：主题色、版本号、调试钩子 */
(function () {
  const origInit = PCL.init;
  PCL.init = async function () {
    await origInit.apply(this, arguments);
    // 应用主题色
    if (PCL.state.settings.themeColor) {
      document.documentElement.style.setProperty('--accent', PCL.state.settings.themeColor);
    }
    // 版本号
    try {
      const info = await API.appInfo();
      const el = PCL.$('#brandVer');
      if (el && info.version) el.textContent = 'v' + info.version;
      PCL.state.pageData.appInfo = info;
    } catch (e) {}

    // 后台自动寻找本机 Java；找不到不阻塞界面，打开设置时会复用这份结果
    PCL.javaScan = API.java.detect()
      .then((list) => {
        const found = Array.isArray(list) ? list : [];
        PCL.state.pageData.javaList = found;
        const selected = PCL.state.settings.javaPath || '';
        const same = (a, b) => {
          if (!a || !b) return false;
          return String(a).replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase() ===
            String(b).replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
        };
        const selectedFound = found.some((j) => same(j.path, selected));
        if (found.length && (!selected || !selectedFound)) {
          PCL.state.settings.javaPath = found[0].path;
          API.settings.set({ javaPath: found[0].path }).catch(() => {});
        }
        return found;
      })
      .catch(() => []);

    // 支持 #download:mod 这样的深链接（便于截图与调试）
    const hash = (location.hash || '').replace('#', '');
    const [hp, ht] = hash.split(':');
    if (ht) {
      if (hp === 'download') PCL.state.pageData.dlTab = ht;
      if (hp === 'settings') PCL.state.pageData.setTab = ht;
      if (hp === 'version') PCL.state.pageData.vTab = ht;
      if (hp === 'more') PCL.state.pageData.moreTab = ht;
    }
    if (hp && window.PCLPages[hp]) await PCL.go(hp);
    window.addEventListener('hashchange', () => {
      const h = (location.hash || '').replace('#', '');
      const [p, t] = h.split(':');
      if (t) {
        if (p === 'download') PCL.state.pageData.dlTab = t;
        if (p === 'settings') PCL.state.pageData.setTab = t;
        if (p === 'version') PCL.state.pageData.vTab = t;
        if (p === 'more') PCL.state.pageData.moreTab = t;
      }
      if (p && window.PCLPages[p]) PCL.go(p);
    });
  };
})();

/* 调试：?debug 时把关键尺寸写进标题，便于排查布局 */
(function () {
  if (!location.search.includes('debug')) return;
  setTimeout(() => {
    const el = document.querySelector('.view');
    const main = document.getElementById('main');
    const app = document.querySelector('.app');
    document.title = JSON.stringify({
      win: [innerWidth, innerHeight],
      app: app ? app.getBoundingClientRect().height : 0,
      main: main ? main.getBoundingClientRect().height : 0,
      view: el ? el.getBoundingClientRect().height : 0,
      bodyH: document.body.scrollHeight,
      dpr: devicePixelRatio,
    });
  }, 800);
})();
