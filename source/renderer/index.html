<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>StartPro Launcher (SPL) · Minecraft Launcher</title>
  <link rel="icon" href="assets/icon-web.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/assistant.css" />
  <link rel="stylesheet" href="css/diagnostics.css" />
</head>
<body>
  <div class="app">
    <!-- 标题栏 -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <span class="brand-mark">SPL</span>
        <span class="brand-logo">StartPro</span>
        <span class="brand-ver" id="brandVer">1.2.1</span>
      </div>
      <div class="vdtb" id="vdBar" hidden>
        <button class="vd-back" id="vdBack" title="返回">
          <svg viewBox="0 0 16 16"><path d="M7 3L2.5 8l4.5 5M2.5 8h11" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <span class="vd-title" id="vdTitle"></span>
      </div>
      <nav class="topnav" id="topnav"></nav>
      <div class="win-controls">
        <button class="win-btn" id="btnMin" title="最小化">
          <svg viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        </button>
        <button class="win-btn" id="btnMax" title="最大化">
          <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="win-btn close" id="btnClose" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        </button>
      </div>
    </header>

    <!-- 页面主体 -->
    <main class="main" id="main"></main>
  </div>

  <div class="toast-layer" id="toasts"></div>
  <div id="modals"></div>

  <!-- 底部任务进度浮窗 -->
  <div class="task-panel" id="taskPanel">
    <div class="tp-head">
      <span id="tpTitle">正在下载</span>
      <span class="muted tiny" id="tpPercent">0%</span>
    </div>
    <div class="progress" id="tpBar"><i></i></div>
    <div class="tp-detail">
      <span id="tpDetail">准备中…</span>
      <span id="tpCount"></span>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/versions.js"></script>
  <script src="js/pages/download.js"></script>
  <script src="js/pages/multiplayer.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/more.js"></script>
  <script src="js/diagnostics.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
