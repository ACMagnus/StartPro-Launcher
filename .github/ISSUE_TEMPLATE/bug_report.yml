name: Bug 反馈
description: 报告启动器崩溃、下载失败、启动失败或界面异常
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量附上版本号、复现步骤和日志，便于定位。
  - type: input
    id: version
    attributes:
      label: StartPro Launcher 版本
      placeholder: 例如 1.2.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 x64
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: 游戏版本 / 加载器
      placeholder: 例如 1.21.1 + Fabric 0.16.9
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开... 2. 点击... 3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴启动器日志末尾，或拖入截图。
      placeholder: 日志位于 %APPDATA%\StartPro Launcher\logs
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有重复问题
          required: true
        - label: 我没有在内容中填写 API Key、账号密码等敏感信息
          required: true
